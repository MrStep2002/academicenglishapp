<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Golden 100 Word Games</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an annotated exam text. Ink on cool paper, a highlighter for the words that matter, one column of play. */
:root{
  --paper:#f5f6f9; --sheet:#ffffff; --ink:#18203a; --ink-2:#4a5270; --rule:#dfe2ec;
  --mark:#ffe766; --mark-ink:#18203a; --blue:#2f4fc4; --blue-soft:#e6ebfb;
  --good:#1f7a4d; --good-soft:#e2f3ea; --bad:#b8392a; --bad-soft:#fbe7e3;
  --f-display:"Gloock", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --f-zh:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11152a; --sheet:#1a1f38; --ink:#e8ebf6; --ink-2:#a9b0cc; --rule:#2c3354;
  --mark:#d8c23e; --mark-ink:#141829; --blue:#8ea4ff; --blue-soft:#232b52;
  --good:#5fd39a; --good-soft:#173a2b; --bad:#ff8a78; --bad-soft:#43201c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11152a; --sheet:#1a1f38; --ink:#e8ebf6; --ink-2:#a9b0cc; --rule:#2c3354;
  --mark:#d8c23e; --mark-ink:#141829; --blue:#8ea4ff; --blue-soft:#232b52;
  --good:#5fd39a; --good-soft:#173a2b; --bad:#ff8a78; --bad-soft:#43201c; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
mark,.hl{background:linear-gradient(transparent 12%, var(--mark) 12%, var(--mark) 88%, transparent 88%);color:var(--mark-ink);padding:0 .15em;border-radius:2px}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.brand{display:flex;align-items:baseline;gap:10px;background:none;border:0;padding:0}
.brand b{font-family:var(--f-display);font-weight:400;font-size:26px;letter-spacing:-.01em}
.brand span{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.ghost{background:none;border:1px solid var(--rule);border-radius:8px;padding:6px 12px;font-size:14px;color:var(--ink-2)}
.ghost:hover{border-color:var(--ink-2);color:var(--ink)}

/* hero */
.hero{padding-block:8px 24px;border-bottom:1px solid var(--rule);margin-bottom:24px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,6vw,52px);line-height:1.05;margin:0 0 12px;text-wrap:balance;letter-spacing:-.01em}
.hero p{margin:0;max-width:60ch;color:var(--ink-2)}

/* set chips */
.sets{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:7px 14px;font-size:14px;display:flex;gap:8px;align-items:center}
.chip small{font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:var(--paper);opacity:.75}
.setnote{font-size:14px;color:var(--ink-2);margin:6px 0 0}

/* game list */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:22px}
.game{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:18px 18px 16px;text-align:left;display:flex;flex-direction:column;gap:10px;transition:transform .12s, border-color .12s}
.game:hover{border-color:var(--ink-2);transform:translateY(-2px)}
.game h3{font-family:var(--f-display);font-weight:400;font-size:23px;margin:0;line-height:1.15}
.game p{margin:0;font-size:15px;color:var(--ink-2)}
.sample{font-size:15px;border-top:1px dashed var(--rule);padding-top:10px;margin-top:auto}
.sample .zh{font-family:var(--f-zh);font-size:18px}
.gap-blank{display:inline-block;min-width:4.2em;border-bottom:2px solid var(--ink);margin:0 .15em}
.best{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);letter-spacing:.06em}
.wl-link{margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:18px}
.wl-link p{margin:0;color:var(--ink-2);font-size:15px}

/* play screen */
.bar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.bar .title{font-family:var(--f-display);font-size:22px}
.progress{flex:1;height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}
.score{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:clamp(18px,4vw,32px)}
.instr{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0 0 14px}
.sentence{font-size:clamp(20px,3.4vw,26px);line-height:1.45;margin:0 0 22px;text-wrap:pretty}
.sentence .slot{display:inline-block;min-width:5em;border-bottom:2.5px solid var(--ink);text-align:center;padding:0 .2em;transition:background .2s}
.sentence .slot.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.sentence .slot.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:10px;align-items:center;text-align:left;background:var(--paper);border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px;font-size:17px;min-height:52px}
.opt kbd{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:1px 6px;background:var(--sheet)}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700}
.opt.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opt.dim{opacity:.5}
.feedback{margin-top:18px;padding:14px 16px;border-radius:10px;font-size:16px;display:grid;gap:6px}
.feedback.ok{background:var(--good-soft)}
.feedback.no{background:var(--bad-soft)}
.feedback .verdict{font-weight:700}
.feedback.ok .verdict{color:var(--good)} .feedback.no .verdict{color:var(--bad)}
.feedback .wd{font-size:15px;color:var(--ink-2)}
.feedback .wd b{color:var(--ink)}
.next-row{display:flex;justify-content:flex-end;margin-top:16px}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:10px;padding:12px 22px;font-weight:700;font-size:16px}
.btn:hover{opacity:.9}
.btn.alt{background:none;color:var(--ink);border:1.5px solid var(--ink)}

/* zh prompt */
.zh-prompt{font-family:var(--f-zh);font-size:clamp(34px,7vw,52px);line-height:1.2;margin:4px 0 6px}
.pos{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);letter-spacing:.06em;margin-bottom:22px}

/* match */
.match{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:12px}
.col{display:grid;gap:10px;align-content:start}
.tile{background:var(--paper);border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px;text-align:left;font-size:16px;min-height:56px;transition:border-color .12s, background .12s}
.tile.word{font-family:var(--f-display);font-size:20px}
.tile.syn{font-size:15px}
.tile.syn span+span::before{content:" · ";color:var(--ink-2)}
.tile:hover:not(:disabled){border-color:var(--blue)}
.tile.sel{border-color:var(--blue);background:var(--blue-soft)}
.tile.done{background:var(--good-soft);border-color:var(--good);color:var(--good);cursor:default}
.tile.shake{animation:shake .35s;border-color:var(--bad);background:var(--bad-soft)}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@media (prefers-reduced-motion:reduce){.tile.shake{animation:none}.game:hover{transform:none}}
@media (max-width:520px){.match{grid-template-columns:1fr}.col.left{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* own words */
.extract{font-size:clamp(19px,3vw,23px);line-height:1.6;border-left:3px solid var(--ink);padding:4px 0 4px 18px;margin:0 0 24px;text-wrap:pretty}
.extract u{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.extract u.now{background:linear-gradient(transparent 12%, var(--mark) 12%, var(--mark) 88%, transparent 88%);color:var(--mark-ink)}
.sub{border-top:1px solid var(--rule);padding-top:16px;margin-top:16px}
.sub:first-of-type{border-top:0;margin-top:0;padding-top:0}
.sub h4{margin:0 0 10px;font-weight:400;font-size:17px}
.sub h4 b{font-family:var(--f-display);font-weight:400;font-size:22px}
.sub .why{font-size:15px;color:var(--ink-2);margin-top:8px}

/* end */
.end h2{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,44px);margin:0 0 4px}
.end .big{font-family:var(--f-display);font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.review{margin:22px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.review li{border-top:1px solid var(--rule);padding-top:10px;font-size:15px}
.review li b{font-family:var(--f-display);font-weight:400;font-size:18px}
.end-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}

/* word list */
.search{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink);margin-bottom:12px}
.wl{display:grid;gap:0;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.wl-row{display:grid;grid-template-columns:2.5em minmax(0,11em) minmax(0,1fr);gap:12px;padding:12px 16px;border-top:1px solid var(--rule)}
.wl-row:first-child{border-top:0}
.wl-row .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);padding-top:4px;font-variant-numeric:tabular-nums}
.wl-row .w{font-family:var(--f-display);font-size:20px;line-height:1.2}
.wl-row .w small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--ink-2);letter-spacing:.05em}
.wl-row .w .zh{font-family:var(--f-zh);font-size:14px;color:var(--ink-2)}
.wl-row .d{font-size:15px;min-width:0}
.wl-row .d i{color:var(--ink-2)}
.wl-row .d .syns{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);margin-top:4px}
@media (max-width:520px){.wl-row{grid-template-columns:2em minmax(0,1fr)}.wl-row .d{grid-column:2}}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.footer{margin-top:40px;font-size:13px;color:var(--ink-2);border-top:1px solid var(--rule);padding-top:14px}
</style>

[20,"justify","verb","Support a decision or argument with reasons.","Justify your interpretation using details from the passage.","证明……有道理；为……辩护",["defend","back up","give reasons for"],""],
[21,"anxious","adjective","Worried about what might happen.","She waited outside the office, anxious about the result.","焦虑的",["worried","nervous","on edge"],"worry"],
[22,"cautious","adjective","Careful to avoid danger or mistakes.","He took a cautious step onto the frozen pond.","谨慎的",["careful","wary","guarded"],"care"],
[23,"confident","adjective","Sure of yourself or your ability.","Her confident voice reassured the younger children.","自信的",["self-assured","certain","poised"],""],
[24,"curious","adjective","Wanting to discover or understand something.","A curious child peered through the gap in the fence.","好奇的",["inquisitive","interested","nosy"],""],
[25,"frustrated","adjective","Annoyed because something prevents progress or success.","After three failed attempts, he felt increasingly frustrated.","沮丧的；受挫的",["annoyed","exasperated","fed up"],""],
[26,"relieved","adjective","No longer worried or frightened.","She was relieved to hear his key turn in the lock.","松了一口气的",["reassured","at ease","comforted"],""],

[31,"hesitate","verb","Pause because you are uncertain.","She hesitated before opening the envelope.","犹豫",["pause","think twice","waver"],"hesit"],
[32,"glance","verb","Look quickly or briefly.","He glanced at the clock and hurried away.","瞥一眼",["peek","glimpse","look briefly"],""],
[33,"mutter","verb","Speak quietly and indistinctly, often in annoyance.","He muttered a complaint beneath his breath.","嘀咕；喃喃抱怨",["mumble","grumble","murmur"],""],

[39,"abruptly","adverb","Suddenly and unexpectedly, sometimes rudely.","He abruptly ended the conversation.","突然地；唐突地",["suddenly","sharply","without warning"],""],
[40,"deliberately","adverb","Intentionally; on purpose.","She deliberately left his name off the invitation.","故意地",["on purpose","intentionally","knowingly"],""],
[41,"apprehensive","adjective","Worried that something unpleasant may happen.","He felt apprehensive as the interview approached.","忧虑的；担心的",["fearful","uneasy about the future","dreading"],"worry"],

[53,"conceal","verb","Hide something or prevent it from being known.","He smiled to conceal his disappointment.","隐藏；掩盖",["hide","cover up","disguise"],"hide"],

[57,"bitterly","adverb","With strong anger, unhappiness or disappointment.","He complained bitterly about his exclusion from the team.","痛苦地；愤恨地",["angrily","resentfully","painfully"],"anger"],

[1,"In your essay, ___ how the writer uses the weather to reflect the character's mood.","analyse",["infer","imply","glance"],"<b>Analyse</b> means examine the details and how they work together. You infer or imply <i>that</i> something is true, not <i>how</i> a writer works, and <i>glance</i> needs <i>at</i>."],

// choose n words with no two from the same near-meaning family and no shared synonym
function pickDistinct(list, n){
  const out=[], fams=new Set(), syns=new Set();
  for(const w of shuffle(list)){
    if(w.fam && fams.has(w.fam)) continue;
    if(w.syn.some(s=>syns.has(s))) continue;
    out.push(w); if(w.fam) fams.add(w.fam); w.syn.forEach(s=>syns.add(s));
    if(out.length===n) break;
  }
  return out;
}

function shell(title, inner){
  $app.innerHTML = topbar() + `<div class="bar"><span class="title">${title}</span><div class="progress"><i id="prog"></i></div><span class="score" id="score"></span></div><div id="stage">${inner||''}</div>`;

}
const stage = () => document.getElementById('stage');
function setProgress(done,total,score,label){
  document.getElementById('prog').style.width = (100*done/total)+'%';
  document.getElementById('score').textContent = `${label||'Score'} ${score}/${total}`;
}

function endScreen(key, title, correct, total, reviewHtml, again){
  const pct = Math.round(100*correct/Math.max(total,1));
  const best = store.get('best:'+key,null);
  if(best==null||pct>best) store.set('best:'+key,pct);
  document.getElementById('prog').style.width='100%';
  const msg = pct>=90?'Excellent. Try a harder set next.':pct>=70?'Good work. Look over the words you missed.':pct>=50?'Getting there. Review the words below and play again.':'Use the word list to revise these, then try again.';
  stage().innerHTML = `<div class="card end"><p class="instr">Round complete</p>
    <div class="big">${pct}%</div><h2>${correct} of ${total} correct</h2><p>${msg}${best!=null&&pct>best?' New best score.':''}</p>
    ${reviewHtml?`<p class="instr" style="margin-top:22px">To review</p><ul class="review">${reviewHtml}</ul>`:''}
    <div class="end-actions"><button class="btn" id="again">Play again</button><button class="btn alt" id="back">All games</button></div></div>`;
  document.getElementById('again').onclick=again; document.getElementById('back').onclick=home;
  keyHandler = e=>{ if(e.key==='Enter'){ e.preventDefault(); again(); } };
}
const wordNote = w => `<span class="wd"><b>${esc(w.w)}</b> (${w.pos}): ${esc(w.def)}</span>`;
const reviewItem = (w, extra) => `<li><b>${esc(w.w)}</b> – ${esc(w.def)}${extra?`<br><i>${extra}</i>`:''}</li>`;

// generic multiple-choice renderer
function renderMC({instr, promptHtml, options, answer, onAnswer, after}){
  const opts = shuffle(options);
  stage().innerHTML = `<div class="card"><p class="instr">${instr}</p>${promptHtml}
    <div class="opts">${opts.map((o,i)=>`<button class="opt" data-v="${esc(o)}"><kbd>${i+1}</kbd><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="fb"></div></div>`;
  const btns=[...stage().querySelectorAll('.opt')];
  let answered=false;
  const choose = b => {
    if(answered) return; answered=true;
    const v=b.dataset.v, ok=v===answer;
    btns.forEach(x=>{ x.disabled=true; if(x.dataset.v===answer) x.classList.add('ok'); else if(x===b) x.classList.add('no'); else x.classList.add('dim'); });
    const fbHtml = after(ok, v);
    document.getElementById('fb').innerHTML = `<div class="feedback ${ok?'ok':'no'}"><span class="verdict">${ok?'Correct.':'Not quite. The answer is '+esc(answer)+'.'}</span>${fbHtml}</div>
      <div class="next-row"><button class="btn" id="next">Next →</button></div>`;
    const nx=document.getElementById('next'); nx.focus({preventScroll:true});
    nx.onclick=()=>onAnswer(ok,v);
    keyHandler = e=>{ if(e.key==='Enter'){ e.preventDefault(); onAnswer(ok,v);} };
  };
  btns.forEach(b=>b.onclick=()=>choose(b));
  keyHandler = e=>{ const n=parseInt(e.key,10); if(n>=1&&n<=btns.length){ choose(btns[n-1]); } };
}

// ===== GAME 1: GAP FILL =====
function playGap(){
  let items = shuffle(GAPS.filter(g=>inSets(g[0]))).slice(0,10);
  let i=0, score=0, missed=[];
  shell('Fill the gap');
  const step = () => {
    setProgress(i,items.length,score);
    if(i>=items.length) return endScreen('gap','Fill the gap',score,items.length, missed.map(m=>reviewItem(byId[m[0]], esc(m[1].replace('___',m[2])))).join(''), playGap);
    const g=items[i], parts=g[1].split('___');
    renderMC({instr:`Question ${i+1} of ${items.length} · Choose the word that fits`,
      promptHtml:`<p class="sentence">${esc(parts[0])}<span class="slot" id="slot">&nbsp;</span>${esc(parts[1])}</p>`,
      options:[g[2],...g[3]], answer:g[2],
      after:(ok,v)=>{ const s=document.getElementById('slot'); s.textContent=g[2]; s.classList.add(ok?'ok':'no');
        if(ok) score++; else missed.push(g);
        setProgress(i+1,items.length,score);
        return `<span>${g[4]}</span>${wordNote(byId[g[0]])}`; },
      onAnswer:()=>{ i++; step(); }});
  };
  step();
}

  const p = pool();
  const items = shuffle(p).slice(0,10);
  let i=0, score=0, missed=[];
  shell('中文 → English');
  const step = () => {
    setProgress(i,items.length,score);
    if(i>=items.length) return endScreen('zh','中文 → English',score,items.length, missed.map(w=>reviewItem(w, esc(w.zh)+' · '+esc(w.ex))).join(''), playZh);
    const w=items[i];
    // distractors: same part of speech, different family; prefer the chosen sets, fall back to all words
    const ok = x => x.id!==w.id && (!w.fam || x.fam!==w.fam);
    let cand = shuffle(p.filter(x=>ok(x)&&x.pos===w.pos));
    if(cand.length<3) cand = cand.concat(shuffle(WORDS.filter(x=>ok(x)&&x.pos===w.pos&&!cand.includes(x))));
    const fams=new Set(); const ds=[];
    cand = cand.concat(shuffle(p.filter(x=>ok(x)&&x.pos!==w.pos)));
    for(const c of cand){ if(c.fam&&fams.has(c.fam)) continue; if(ds.includes(c.w)) continue; ds.push(c.w); if(c.fam) fams.add(c.fam); if(ds.length===3) break; }
    renderMC({instr:`Question ${i+1} of ${items.length} · Choose the English word`,
      promptHtml:`<div class="zh-prompt" lang="zh-CN">${esc(w.zh)}</div><div class="pos">${w.pos}</div>`,
      options:[w.w,...ds], answer:w.w,
      after:(good)=>{ if(good) score++; else missed.push(w); setProgress(i+1,items.length,score);
        return `${wordNote(w)}<span class="wd"><i>${esc(w.ex)}</i></span>`; },
      onAnswer:()=>{ i++; step(); }});
  };
  step();
}

// ===== GAMES 2 & 3: MATCHING =====
function playMatch(mode){
  const title = mode==='def'?'Match the meaning':'Synonym groups';
  const BOARDS=3, PER=5;
  let p = pool(); if(p.length<PER) p=WORDS;
  // take three boards of distinct words where possible
  let usedIds=new Set(), boards=[];
  for(let b=0;b<BOARDS;b++){
    let avail=p.filter(w=>!usedIds.has(w.id)); if(avail.length<PER) avail=p;
    const set=pickDistinct(avail,PER); set.forEach(w=>usedIds.add(w.id)); boards.push(set);
  }
  let bi=0, tries=0, firstTry=0, missedIds=new Set();
  const total=BOARDS*PER;
  shell(title);
  const board = () => {
    if(bi>=BOARDS){
      const rev=[...missedIds].map(id=>reviewItem(byId[id], mode==='syn'?esc(byId[id].syn.join(' · ')):'')).join('');
      return endScreen(mode,title,firstTry,total,rev,()=>playMatch(mode));
    }
    const set=boards[bi];
    const left=shuffle(set), right=shuffle(set);
    const rightText = w => mode==='def' ? esc(w.def) : w.syn.map(s=>`<span>${esc(s)}</span>`).join('');
    stage().innerHTML = `<div class="card"><p class="instr">Board ${bi+1} of ${BOARDS} · ${mode==='def'?'Tap a word, then its meaning':'Tap a word, then the group that means something similar'}</p>
      <div class="match"><div class="col left">${left.map(w=>`<button class="tile word" data-id="${w.id}" data-side="L">${esc(w.w)}</button>`).join('')}</div>
      <div class="col right">${right.map(w=>`<button class="tile ${mode}" data-id="${w.id}" data-side="R">${rightText(w)}</button>`).join('')}</div></div>
      <div id="fb"></div></div>`;
    let sel=null, done=0, wrongOn=new Set();
    const upd=()=>{ document.getElementById('prog').style.width=(100*(bi*PER+done)/total)+'%'; document.getElementById('score').textContent=`First try ${firstTry}/${total}`; };
    upd();
    stage().querySelectorAll('.tile').forEach(t=>t.onclick=()=>{
      if(t.classList.contains('done')) return;
      if(!sel||sel.dataset.side===t.dataset.side){ if(sel) sel.classList.remove('sel'); sel=t; t.classList.add('sel'); return; }
      const a=sel, b=t; a.classList.remove('sel'); sel=null;
      const L = a.dataset.side==='L'?a:b;
      if(a.dataset.id===b.dataset.id){
        [a,b].forEach(x=>{x.classList.add('done'); x.disabled=true;});
        if(!wrongOn.has(L.dataset.id)) firstTry++;
        done++; upd();
        if(done===PER){
          document.getElementById('fb').innerHTML=`<div class="next-row"><button class="btn" id="next">${bi+1<BOARDS?'Next board →':'See results →'}</button></div>`;
          const go=()=>{bi++; board();};
          const nx=document.getElementById('next'); nx.onclick=go; nx.focus({preventScroll:true});
          keyHandler=e=>{ if(e.key==='Enter'){e.preventDefault(); go();} };
        }
      } else {
        wrongOn.add(L.dataset.id); missedIds.add(+L.dataset.id); tries++;
        [a,b].forEach(x=>{x.classList.remove('shake'); void x.offsetWidth; x.classList.add('shake'); setTimeout(()=>x.classList.remove('shake'),400);});
      }
    });
    keyHandler=null;
  };
  board();
}

// ===== GAME 5: IN YOUR OWN WORDS (0500 style) =====
function playOwn(){
  let items = shuffle(OWN.filter(o=>o.ids.some(inSets)));
  if(items.length<3) items=shuffle(OWN);
  items=items.slice(0,6);
  const total=items.reduce((n,o)=>n+o.qs.length,0);
  let i=0, score=0, answeredCount=0, missed=[];
  shell('In your own words');
  const step = () => {
    setProgress(answeredCount,total,score);
    if(i>=items.length) return endScreen('own','In your own words',score,total, missed.map(m=>reviewItem(byId[m.id], 'In context: '+esc(m.ans))).join(''), playOwn);
    const o=items[i];
    const words=[]; let k=0;
    const textHtml = esc(o.t).replace(/\[([^\]]+)\]/g,(m,w)=>{words.push(w); return `<u data-k="${k++}">${w}</u>`;});
    stage().innerHTML = `<div class="card"><p class="instr">Extract ${i+1} of ${items.length} · Using your own words, explain what the writer means by each of the underlined words</p>
      <p class="extract">${textHtml}</p>
      ${o.qs.map((q,j)=>{ const opts=shuffle([q[0],...q[1]]);
        return `<div class="sub" data-j="${j}"><h4><b>${esc(words[j])}</b> means…</h4>
        <div class="opts">${opts.map((x,n)=>`<button class="opt" data-v="${esc(x)}"><kbd>${n+1}</kbd><span>${esc(x)}</span></button>`).join('')}</div><div class="why"></div></div>`;}).join('')}
      <div id="fb"></div></div>`;
    let active=0, doneHere=0;
    const subs=[...stage().querySelectorAll('.sub')];
    const highlight=()=>stage().querySelectorAll('.extract u').forEach(u=>u.classList.toggle('now', +u.dataset.k===active));
    highlight();
    subs.forEach((sub,j)=>{
      const q=o.qs[j], btns=[...sub.querySelectorAll('.opt')];
      sub.addEventListener('focusin',()=>{ if(!sub.dataset.done){active=j; highlight();} });
      sub.addEventListener('mouseenter',()=>{ if(!sub.dataset.done){active=j; highlight();} });
      sub._choose = b => {
        if(sub.dataset.done) return; sub.dataset.done='1';
        const ok=b.dataset.v===q[0]; const w=byId[o.ids[j]];
        btns.forEach(x=>{x.disabled=true; if(x.dataset.v===q[0]) x.classList.add('ok'); else if(x===b) x.classList.add('no'); else x.classList.add('dim');});
        if(ok) score++; else missed.push({id:o.ids[j],ans:q[0]});
        answeredCount++; doneHere++;
        sub.querySelector('.why').innerHTML = `${ok?'Correct.':'In this extract it means “'+esc(q[0])+'”.'} Dictionary meaning of <b>${esc(w.w)}</b>: ${esc(w.def)}`;
        setProgress(answeredCount,total,score);
        const nextOpen = subs.findIndex(s=>!s.dataset.done);
        if(nextOpen>=0){ active=nextOpen; highlight(); }
        else {
          active=-1; highlight();
          document.getElementById('fb').innerHTML=`<div class="next-row"><button class="btn" id="next">${i+1<items.length?'Next extract →':'See results →'}</button></div>`;
          const go=()=>{i++; step();};
          const nx=document.getElementById('next'); nx.onclick=go; nx.focus({preventScroll:true});
          keyHandler=e=>{ if(e.key==='Enter'){e.preventDefault(); go();} };
        }
      };
      btns.forEach(b=>b.onclick=()=>sub._choose(b));
    });
    // number keys answer the highlighted word
    keyHandler = e=>{ const n=parseInt(e.key,10); if(active>=0 && n>=1 && n<=4){ const sub=subs[active]; const b=sub.querySelectorAll('.opt')[n-1]; if(b) sub._choose(b);} };
  };
  step();
}

// ===== WORD LIST =====
function wordList(){
  keyHandler=null;
  let showZh = store.get('zh',true), q='';
  $app.innerHTML = topbar() + `<div class="bar"><span class="title">Word list</span><span style="flex:1"></span>
    <label class="toggle"><input type="checkbox" id="zhT" ${showZh?'checked':''}> Show Chinese</label></div>
    <input class="search" id="q" type="search" placeholder="Search words, meanings or synonyms" aria-label="Search the word list">
    <div id="list"></div>`;
  wireTop();
  const draw=()=>{
    const t=q.trim().toLowerCase();
    let html='';
    for(const s of SETS){
      const ws=WORDS.filter(w=>w.set===s.n && (!t || w.w.includes(t) || w.def.toLowerCase().includes(t) || w.syn.some(x=>x.includes(t)) || w.zh.includes(t)));
      if(!ws.length) continue;
      html += `<p class="instr" style="margin:22px 0 8px">${s.name} · ${s.lvl}</p><div class="wl">${ws.map(w=>`<div class="wl-row"><span class="n">${w.id}</span>
        <div class="w">${esc(w.w)}<small>${w.pos}</small>${showZh?`<span class="zh" lang="zh-CN">${esc(w.zh)}</span>`:''}</div>
        <div class="d">${esc(w.def)}<br><i>${esc(w.ex)}</i><div class="syns">≈ ${esc(w.syn.join(' · '))}</div></div></div>`).join('')}</div>`;
    }
    document.getElementById('list').innerHTML = html || '<p>No words match that search.</p>';
  };
  document.getElementById('q').oninput=e=>{q=e.target.value; draw();};
  document.getElementById('zhT').onchange=e=>{showZh=e.target.checked; store.set('zh',showZh); draw();};
  draw();
}

home();
</script>
