<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<meta name="theme-color" content="#151935">
<meta name="robots" content="noindex">
<title>Staff Room · Academic English App</title>
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/home.css?v=2026-11-03b">
<link rel="stylesheet" href="board.css?v=2026-11-07d">
<link rel="stylesheet" href="starters.css?v=2026-11-08e">
<link rel="stylesheet" href="handouts.css?v=2026-11-08a">
<link rel="stylesheet" href="../css/site.css?v=2026-11-09a">
<style>
  .home { max-width: 1040px; }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .narrow { max-width: 480px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label, .lab { font-weight: 700; }
  input[type=text], input[type=password], input[type=number], textarea { font: inherit; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
  textarea { min-height: 160px; resize: vertical; }
  input:focus, textarea:focus { outline: none; border-color: var(--web); }
  input[type=number] { width: 7em; }
  .btn { font: inherit; font-weight: 700; padding: 10px 16px; border-radius: 10px; border: 2px solid var(--ink); background: var(--ink); color: var(--card); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .btn.alt { background: transparent; color: var(--ink); }
  .btn.small { padding: 5px 10px; font-size: .85rem; border-width: 1.5px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn:focus-visible, a:focus-visible { outline: 3px solid var(--web); outline-offset: 2px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .spread { display: flex; gap: 10px 16px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .err { margin: 0; color: #c0392b; font-weight: 700; }
  @media (prefers-color-scheme: dark) { .err { color: #ff8a78; } }
  .note { margin: 0; color: var(--muted); font-size: .92rem; }
  .warn { margin: 0; background: var(--hi); color: #151935; padding: 10px 14px; border-radius: 10px; font-weight: 700; }
  h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 1.4rem; }
  .classes { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .class-card { display: flex; flex-direction: column; gap: 2px; padding: 18px; border-radius: 16px; background: var(--card); border: 2px solid var(--line); color: var(--ink); text-decoration: none; }
  .class-card:hover { border-color: var(--web); }
  .class-card b { font-family: var(--display); font-size: 1.3rem; }
  .class-card span { color: var(--muted); font-size: .92rem; }
  .choice { display: flex; gap: 8px; align-items: flex-start; }
  .choice input { margin-top: 5px; }
  .choice[hidden] { display: none; }
  .tablewrap { overflow-x: auto; border: 2px solid var(--line); border-radius: 14px; background: var(--card); }
  table { border-collapse: collapse; width: 100%; font-size: .95rem; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  th { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--bg); }
  th button { all: unset; cursor: pointer; } th button:focus-visible { outline: 2px solid var(--web); }
  td.num { font-variant-numeric: tabular-nums; }
  td .sub { color: var(--muted); font-size: .85rem; }
  .zh { font-family: var(--zh); }
  select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); }
  select.small { padding: 3px 6px; font-size: .88rem; border-width: 1.5px; }
  input[type=datetime-local] { font: inherit; padding: 8px 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .tabs a { padding: 8px 14px; border-radius: 99px; border: 2px solid var(--line); color: var(--ink); text-decoration: none; font-weight: 700; }
  .tabs a[aria-current] { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .grid2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); align-items: end; }
  .games-list { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .game-card { display: flex; flex-direction: column; gap: 4px; padding: 16px 18px; border-radius: 16px; background: var(--card); border: 2px solid var(--line); color: var(--ink); text-decoration: none; }
  .game-card:hover { border-color: var(--web); }
  .game-card b { font-family: var(--display); font-size: 1.2rem; }
  .game-card .note { font-size: .88rem; }
  .game-card.closed { opacity: .65; }
  .counts { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: .9rem; }
  .st { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: .82rem; font-weight: 700; background: var(--bg); border: 1.5px solid var(--line); }
  .st.passed { background: #d8f3e3; border-color: #23a05c; color: #135c33; }
  .st.playing { background: #fff1c2; border-color: #d9a400; color: #5a4300; }
  .st.below { background: #fde0dc; border-color: #c0392b; color: #7a1d12; }
  .st.late { background: transparent; border-color: #c0392b; color: #c0392b; margin-left: 4px; }
  @media (prefers-color-scheme: dark) {
    .st.passed { background: #123a25; color: #9be7bb; } .st.playing { background: #3d3205; color: #ffe08a; }
    .st.below { background: #43160f; color: #ffb3a7; } .st.late { color: #ff8a78; border-color: #ff8a78; } }
  .big-num { font-family: var(--display); font-weight: 800; font-size: 1.15rem; }
  .muted { color: var(--muted); }
  /* Login cards to print and cut out */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .lc { border: 2px dashed var(--line); border-radius: 12px; padding: 14px 16px; background: var(--card); display: flex; flex-direction: column; gap: 4px; break-inside: avoid; }
  .lc .site { font-size: .8rem; color: var(--muted); }
  .lc .k { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; margin-top: 4px; }
  .lc .v { font-family: var(--display); font-weight: 800; font-size: 1.35rem; line-height: 1.1; }
  .lc .pw { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 1.35rem; font-weight: 500; letter-spacing: .04em; }
  @media print {
    body { background: #fff; color: #000; font-size: 12pt; }
    .home { max-width: none; padding: 0; gap: 0; }
    .home > :not(#view), #view > :not(.cards) { display: none !important; }
    .cards { grid-template-columns: repeat(3, 1fr); gap: 4mm; }
    .lc { border: 1px dashed #888; background: #fff; color: #000; padding: 4mm 5mm; }
    .lc .site, .lc .k { color: #444; }
  }
  /* Reports (31 Oct 2026) */
  .btn.danger { background: #c0392b; border-color: #c0392b; color: #fff; }
  .reps { display: flex; flex-direction: column; gap: 12px; }
  .rep { gap: 8px; padding: 16px 18px; }
  .rep p { margin: 0; }
  .rep-name { font-family: var(--display); font-size: 1.1rem; }
  .rep-shown { margin: 0; font: inherit; white-space: pre-wrap; word-break: break-word; background: var(--bg); border-radius: 10px; padding: 10px 12px; }
  .rep-comments { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
  .rep-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .rep-count { margin-left: 4px; }
  /* Suggestions (3 Nov 2026) */
  .sg-card { gap: 8px; padding: 16px 18px; }
  .sg-card p { margin: 0; }
  .sg-said { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 1.05rem; line-height: 1.45; }
  .sg-kindtag { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: .82rem; font-weight: 700; background: var(--bg); border: 1.5px solid var(--line); }
  /* Shared classes (9 Nov 2026): the line on a class page */
  .share-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 14px; padding: 12px 16px; border: 1.5px dashed var(--line); border-radius: 12px; }
  .share-line p, .share-line .note { margin: 0; flex-basis: 100%; }
  .share-line label { font-weight: 700; }
  .share-line input[type=text] { width: 13em; padding: 6px 10px; }
  .share-line .who { display: inline-flex; align-items: center; gap: 6px; }
</style>
</head>
<body class="aea-staff">
<!-- The Staff Room (9 Nov 2026, was "Teacher"): in the site's sidebar and top bar (en/engine/shell.js, data-staff). The path
     in the top bar starts at Staff Room; the teacher's name, Change password and Log out are in the top bar (#me). The main
     view: four lists (Classes, Starters, Handouts, Board Games), and Reports and Suggestions for the admin only. -->
<main class="home">
  <span id="me" class="note" data-staff-top></span>
  <header class="intro">
    <h1 id="title">Staff Room</h1>
  </header>
  <div id="view" aria-live="polite"><p class="note">Loading…</p></div>
  <noscript><p>Please turn on JavaScript.</p></noscript>
</main>
<script src="board.js?v=2026-11-09a"></script>
<script src="starters.js?v=2026-11-09a"></script>
<script src="handouts.js?v=2026-11-09a"></script>
<script src="../en/engine/subjects.js?v=2026-11-08v"></script>
<script src="../en/engine/shell.js?v=2026-11-09a" data-staff></script>
<script>
/* The Staff Room (the teacher page; named 9 Nov 2026): make classes and student logins, print login cards, see each student's
   points, level and last activity; set starters, handouts and board games.
   Talks to the login server (server/server.js). The teacher's login is kept in this browser as "aea:account:teacher":
   {token, name, keep, until}. Since 26 Oct the login doesn't stay for 30 days unless the teacher ticks "Keep me logged in"
   (for their own computer): otherwise it ends after 2 hours without using this page, so a student on a classroom computer
   can't open the teacher page later. Logins saved before then (no "until") end the next time the page is opened.
   Reports (31 Oct 2026): #/reports lists the questions reported in the games; Keep or Remove each one.
   Suggestions (3 Nov 2026): #/suggestions lists the ideas students sent from the suggestions box on the topic lists.
   Board games (6 Nov 2026): #/board… a game for the whole class on the projector (board.js, board.css).
   Handouts (8 Nov 2026): #/handouts: a two-sided A4 sheet for learning key words, downloaded as a Word file (handouts.js, handouts.css).
   Starters (7 Nov 2026): #/starters… a few minutes of questions on the projector at the start of a lesson (starters.js, starters.css).
   The Staff Room (9 Nov 2026, teacher): the main view is four lists, Classes, Starters (Build the Board, Match Up, Gap Fill,
   Connecting Wall, Wordsearch), Handouts (Vocab) and Board Games (Squaring Up, Don't Say It!, Hints, Categories); Reports
   and Suggestions are for the admin only (the server says who: server/admin.js make-admin), in a strip under the lists.
   Shared classes (9 Nov 2026, teacher: "I just want her to be able to connect with my class"): on a class page the teacher
   who made the class can share it with another teacher (their username) or stop sharing it; the other teacher sees it in
   their Classes list ("from Mr Step") and can do everything with it except share it. */
(function(){
'use strict';
var API = (function(){ var a = ''; try { a = localStorage.getItem('aea:api') || ''; } catch (e) {} return (a || 'https://api.academicenglishapp.com').replace(/\/+$/, ''); })();
var TKEY = 'aea:account:teacher', SITE = 'academicenglishapp.com/login';
var IDLE = 2 * 3600e3, KEEP = 30 * 864e5;   // logged out after 2 hours without using the page; "Keep me logged in": 30 days (as the server)
var view = document.getElementById('view'), title = document.getElementById('title'), me = document.getElementById('me');
// #me (the teacher's name, Change password and Log out) goes in the top bar: shell.js data-staff moves it there
var isAdmin = false;   // from the server (login and the classes list): Reports and Suggestions
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var setAuth = function(a){ try { if (a) localStorage.setItem(TKEY, JSON.stringify(a)); else localStorage.removeItem(TKEY); } catch (e) {} };
var auth = function(){
  var a = null; try { a = JSON.parse(localStorage.getItem(TKEY)); } catch (e) {}
  if (a && !(a.token && a.until > Date.now())) {   // time is up: forget the login here, and end it on the server too
    if (a.token) try { fetch(API + '/api/logout', {method: 'POST', headers: {'Content-Type': 'application/json', Authorization: 'Bearer ' + a.token}, body: '{}'}).catch(function(){}); } catch (e) {}
    setAuth(null); return null;
  }
  return a;
};
var stillHere = function(){ var a = auth(); if (a && !a.keep) { a.until = Date.now() + IDLE; setAuth(a); } };
var lastCards = null;   // passwords just made: only kept on this page until it is left

function call(path, body){
  var a = auth(), headers = {'Content-Type': 'application/json'};
  if (a && a.token) headers.Authorization = 'Bearer ' + a.token;
  return fetch(API + path, {method: body ? 'POST' : 'GET', headers: headers, body: body ? JSON.stringify(body) : undefined})
    .catch(function(){ throw new Error("Can't reach the server. Check your internet connection and try again."); })
    .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(out){
      if (r.status === 401 && path !== '/api/teacher/login') { setAuth(null); route(); throw new Error('Please log in again.'); }
      if (!r.ok) throw new Error(out.error || ('Server error ' + r.status));
      stillHere();
      return out; }); });
}
var fail = function(id){ return function(x){ var e = document.getElementById(id || 'err'); if (e) { e.textContent = x.message; e.hidden = false; } var b = view.querySelector('button[disabled]'); if (b) b.disabled = false; }; };
// The heading, the tab's name and the path in the top bar (Staff Room / this page): the path is the way back
var setTitle = function(t){ title.textContent = t; document.title = (t === 'Staff Room' ? '' : t + ' · ') + 'Staff Room · Academic English App';
  if (window.AEA_SHELL && AEA_SHELL.crumbs) AEA_SHELL.crumbs(t === 'Staff Room' ? [{label: 'Staff Room'}] : [{label: 'Staff Room', href: '#/'}, {label: t}]); };

// "today 14:05", "yesterday", "3 days ago"
function when(t){
  if (!t) return '<span class="muted">never</span>';
  var d = new Date(t), now = new Date(), day = 864e5;
  var start = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  var hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  if (t >= start) return 'today ' + hm;
  if (t >= start - day) return 'yesterday ' + hm;
  var n = Math.ceil((start - t) / day);
  return n < 14 ? n + ' days ago' : d.toLocaleDateString('en-GB', {day: 'numeric', month: 'short', year: 'numeric'});
}

// ---------- logging in ----------
function showLogin(msg){
  setTitle('Log in'); me.innerHTML = ''; sideName(null);
  view.innerHTML = '<form class="card narrow" id="f">' +
    '<div class="field"><label for="u">Username</label><input type="text" id="u" autocomplete="username" autocapitalize="off" spellcheck="false" required></div>' +
    '<div class="field"><label for="p">Password</label><input type="password" id="p" autocomplete="current-password" required></div>' +
    '<label class="choice"><input type="checkbox" id="keep"><span>Keep me logged in on this computer for 30 days' +
    '<br><span class="note">Only on your own computer. Otherwise you are logged out after 2 hours without using this page.</span></span></label>' +
    '<p class="err" id="err" role="alert"' + (msg ? '' : ' hidden') + '>' + esc(msg || '') + '</p>' +
    '<div><button class="btn" type="submit">Log in</button></div>' +
    '<p class="note">Teacher logins are made on the server (see server/README.md in the site\'s folder).</p></form>';
  document.getElementById('u').focus();
  document.getElementById('f').onsubmit = function(e){
    e.preventDefault(); this.querySelector('button').disabled = true; document.getElementById('err').hidden = true;
    var keep = document.getElementById('keep').checked;
    call('/api/teacher/login', {username: document.getElementById('u').value, password: document.getElementById('p').value})
      .then(function(r){ isAdmin = !!r.admin; setAuth({token: r.token, name: r.name, keep: keep, until: Date.now() + (keep ? KEEP : IDLE)}); route(); }).catch(fail());
  };
}
// The teacher's name in the phone menu (shell.js draws it from the login kept here): redrawn when it changes
var shownName = null;
function sideName(n){ if (n === shownName) return; shownName = n; if (window.AEA_SHELL && AEA_SHELL.redraw) AEA_SHELL.redraw(); }
function header(){
  var a = auth(); sideName(a.name);
  me.innerHTML = '<b>' + esc(a.name) + '</b> <a href="#/password" class="muted">Change password</a> <button class="btn small alt" type="button" id="logout">Log out</button>';
  document.getElementById('logout').onclick = function(){ call('/api/logout', {}).catch(function(){}).then(function(){ setAuth(null); location.hash = ''; route(); }); };
}

// ---------- the Staff Room: four lists, and the admin's Reports and Suggestions ----------
var CHEV = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 6 6 6-6 6"/></svg>';
var item = function(href, name, sub){ return '<li><a href="' + href + '"><span>' + name + (sub ? '<small class="sr-n">' + sub + '</small>' : '') + '</span>' + CHEV + '</a></li>'; };
var box = function(name, colour, list, foot){ return '<section class="aea-areabox sr-box" aria-label="' + esc(name) + '"><span class="rule" aria-hidden="true" style="background:' + colour + '"></span><h3>' + esc(name) + '</h3>' +
  '<ul>' + list + '</ul>' + (foot || '') + '</section>'; };
function showClasses(){
  setTitle('Staff Room'); header();
  call('/api/teacher/classes').then(function(r){
    isAdmin = !!r.admin;
    view.innerHTML = '<div class="aea-areas sr-cols">' +
      box('Classes', '#b4286a', r.classes.map(function(c){
        var n = c.students + ' student' + (c.students === 1 ? '' : 's');
        return item('#/class/' + c.id, esc(c.name), n + (c.from ? ' · from ' + esc(c.from) : c.sharedWith && c.sharedWith.length ? ' · shared with ' + esc(c.sharedWith.join(', ')) : '')); }).join('') +
        '<li><a class="sr-add" href="#/new"><span>+ New class</span></a></li>',
        r.classes.length ? '' : '<p class="note sr-foot">No classes yet. Make your first one.</p>') +
      box('Starters', '#1a5cb0', item('#/starters', 'Build the Board') + item('#/starters/match-up', 'Match Up') + item('#/starters/gap-fill', 'Gap Fill') +
        item('#/starters/connecting-wall', 'Connecting Wall') + item('#/starters/word-search', 'Wordsearch')) +
      box('Handouts', '#11694a', item('#/handouts', 'Vocab')) +
      box('Board Games', '#9a4a00', item('#/board/new/squares', 'Squaring Up') + item('#/board/new/taboo', 'Don\'t Say It!') + item('#/board/new/hints', 'Hints') + item('#/board/new/cats', 'Categories'),
        '<p class="sr-foot"><a href="#/board">Your saved board games</a></p>') +
      '</div>' +
      (isAdmin ? '<section class="sr-admin" aria-label="Admin"><p class="sr-admin-k">Admin</p>' +
        '<a href="#/reports">Reports<span id="repn" class="rep-count"></span></a><a href="#/suggestions">Suggestions<span id="sgn" class="rep-count"></span></a></section>' : '');
    if (!isAdmin) return;
    call('/api/teacher/reports').then(function(x){ var n = document.getElementById('repn'); if (n && x.open.length) n.textContent = ' (' + x.open.length + ' to check)'; }).catch(function(){});
    call('/api/teacher/suggestions').then(function(x){ var n = document.getElementById('sgn'); if (n && x.new.length) n.textContent = ' (' + x.new.length + ' new)'; }).catch(function(){});
  }).catch(function(x){ view.innerHTML = '<p class="err">' + esc(x.message) + '</p>'; });
}

// The students part of a form: fun names made for you, or your own list
function studentsFields(isNew){
  return '<fieldset class="card" style="padding:16px"><legend class="lab">Students</legend>' +
    '<label class="choice"><input type="radio" name="how" value="count" checked><span>Make fun names for me: <input type="number" id="count" min="1" max="60" value="25"> students' +
    '<br><span class="note">e.g. "Brave Panda", "Clever Otter". No real names are stored.</span></span></label>' +
    '<label class="choice"><input type="radio" name="how" value="names"><span>I\'ll type the names, one per line (fun names, not real names)</span></label>' +
    '<textarea id="names" placeholder="Batman&#10;Totoro&#10;Captain Kiwi" hidden></textarea>' +
    (isNew ? '<label class="choice"><input type="radio" name="how" value="none"><span>No new logins: I\'ll add students from my other classes' +
      '<br><span class="note">For students you already teach in another class: they keep the same login and progress.</span></span></label>' : '') + '</fieldset>';
}
function wireStudents(){
  var ta = document.getElementById('names');
  Array.prototype.forEach.call(document.querySelectorAll('input[name=how]'), function(r){
    r.onchange = function(){ ta.hidden = r.value !== 'names' || !r.checked; if (!ta.hidden) ta.focus(); };
  });
}
function studentsValue(){
  var how = document.querySelector('input[name=how]:checked').value;
  if (how === 'none') return {none: true};
  if (how === 'names') return {names: document.getElementById('names').value.split('\n').map(function(s){ return s.trim(); }).filter(Boolean)};
  return {count: +document.getElementById('count').value || 0};
}

function showNew(){
  setTitle('New class'); header();
  view.innerHTML = '<form class="card narrow" id="f" style="max-width:620px">' +
    '<div class="field"><label for="cn">Class name</label><input type="text" id="cn" placeholder="e.g. 8B Media" maxlength="60" required></div>' +
    studentsFields(true) +
    '<p class="err" id="err" role="alert" hidden></p>' +
    '<div class="row"><button class="btn" type="submit">Make the class and logins</button><a class="btn alt" href="#/">Cancel</a></div></form>';
  wireStudents(); document.getElementById('cn').focus();
  document.getElementById('f').onsubmit = function(e){
    e.preventDefault(); this.querySelector('button').disabled = true; document.getElementById('err').hidden = true;
    var body = studentsValue(); body.name = document.getElementById('cn').value;
    call('/api/teacher/classes', body).then(function(r){
      if (body.none) { location.hash = '#/class/' + r.class.id + '/existing'; return; }
      showCards(r.class.name, r.students, '#/class/' + r.class.id, 'The class is ready.'); }).catch(fail());
  };
}

// ---------- one class ----------
var sortBy = 'name', sortDown = false;
var COLS = [
  ['name', 'Student'], ['side', 'Version'], ['minLevel', 'Lowest level'], ['lastPlayed', 'Last active'], ['week', 'Points this week'], ['total', 'Points in all'],
  ['level', 'Level'], ['known', 'Words known']];
var LEVEL_LIST = ['Foundation', 'Foundation+', 'Intermediate', 'Intermediate+', 'Advanced'];
// Each student's version (English, or the Chinese version) and the lowest level their class games use (29 Oct)
var sideSelect = function(v, attr){ return '<select class="small" ' + attr + ' aria-label="Version">' +
  '<option value="en"' + (v !== 'zh' ? ' selected' : '') + '>English</option><option value="zh"' + (v === 'zh' ? ' selected' : '') + '>中文版 Chinese</option></select>'; };
var levelSelect = function(v, attr, blank){ return '<select class="small" ' + attr + ' aria-label="Lowest level">' + (blank ? '<option value="">' + blank + '</option>' : '') +
  '<option value="0"' + (!v && !blank ? ' selected' : '') + '>No minimum</option>' +
  LEVEL_LIST.map(function(n, i){ return '<option value="' + (i + 1) + '"' + (v === i + 1 ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select>'; };
var classTabs = function(id, on){ return '<nav class="tabs" aria-label="Class"><a href="#/class/' + id + '"' + (on === 'students' ? ' aria-current="page"' : '') + '>Students</a>' +
  '<a href="#/class/' + id + '/games"' + (on === 'games' ? ' aria-current="page"' : '') + '>Class games</a></nav>'; };
var LEVELS = {Foundation: 1, 'Foundation+': 2, Intermediate: 3, 'Intermediate+': 4, Advanced: 5};
function sortVal(s, k){
  if (k === 'name') return s.name.toLowerCase();
  if (k === 'side') return s.side === 'zh' ? 1 : 0;
  if (k === 'minLevel') return s.minLevel || 0;
  if (k === 'lastPlayed') return s.lastPlayed || s.lastSeen || 0;
  if (k === 'week') return s.en.week + s.zh.week;
  if (k === 'total') return s.en.total + s.zh.total;
  if (k === 'level') return Math.max(LEVELS[s.en.level] || 0, LEVELS[s.zh.level] || 0);
  if (k === 'known') return s.words.known;
  return 0;
}
var pair = function(en, zh){ return '<span title="English version">' + en + '</span> <span class="sub">· <span class="zh" lang="zh" title="Chinese version">中</span> ' + zh + '</span>'; };

function showClass(id){
  header();
  call('/api/teacher/classes/' + id).then(function(r){
    var c = r.class, list = r.students.slice();
    setTitle(c.name);
    list.sort(function(a, b){ var x = sortVal(a, sortBy), y = sortVal(b, sortBy); var d = x < y ? -1 : x > y ? 1 : 0; if (sortBy !== 'name') d = -d; return sortDown ? -d : d; });
    var head = COLS.map(function(col){ return '<th><button type="button" data-sort="' + col[0] + '">' + col[1] + (sortBy === col[0] ? (sortDown ? ' ▴' : ' ▾') : '') + '</button></th>'; }).join('') + '<th></th>';
    var rows = list.map(function(s){
      var also = (s.alsoIn || []).map(function(o){ return o.name; });
      return '<tr><td><b>' + esc(s.name) + '</b>' + (also.length ? '<br><span class="sub">also in ' + esc(also.join(', ')) + '</span>' : '') + '</td>' +
        '<td>' + sideSelect(s.side, 'data-side="' + s.id + '"') + '</td>' +
        '<td>' + levelSelect(s.minLevel || 0, 'data-min="' + s.id + '"') + '</td>' +
        '<td>' + when(s.lastPlayed || s.lastSeen) + '</td>' +
        '<td class="num">' + pair(s.en.week, s.zh.week) + '</td>' +
        '<td class="num">' + pair(s.en.total, s.zh.total) + '</td>' +
        '<td>' + pair(s.en.level ? esc(s.en.level) : '<span class="muted">–</span>', s.zh.level ? esc(s.zh.level) : '<span class="muted">–</span>') + '</td>' +
        '<td class="num">' + s.words.known + ' <span class="sub">(+' + s.words.learning + ' learning)</span></td>' +
        '<td><div class="row" style="flex-wrap:nowrap;gap:6px"><button class="btn small alt" type="button" data-reset="' + s.id + '" data-name="' + esc(s.name) + '">New password</button>' +
        (also.length ? '<button class="btn small alt" type="button" data-remove="' + s.id + '" data-name="' + esc(s.name) + '" data-also="' + esc(also.join(', ')) + '">Remove from class</button>' : '') + '</div></td></tr>';
    }).join('');
    view.innerHTML =
      '<div class="spread" style="margin-bottom:14px"><a class="backlink" href="#/">← Staff Room</a>' +
      '<div class="row"><button class="btn alt" type="button" id="add">+ New students</button>' +
      '<a class="btn alt" href="#/class/' + id + '/existing">+ From your other classes</a>' +
      '<button class="btn alt" type="button" id="resetall">New passwords for everyone</button>' +
      '<button class="btn alt" type="button" id="rename">Rename</button></div></div>' +
      shareLine(r.teachers) +
      classTabs(id, 'students') +
      '<p class="err" id="err" role="alert" hidden></p>' +
      (list.length ? '<div class="row" style="margin-bottom:10px"><span class="lab">Set everyone:</span>' + sideSelect('', 'id="allSide"').replace('<option value="en" selected>', '<option value="" selected>Version…</option><option value="en">') +
        levelSelect(null, 'id="allMin"', 'Lowest level…') + '<span class="note" id="saved" aria-live="polite"></span></div>' +
        '<div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<p class="note" style="margin-top:10px">Version and Lowest level are for class games: each student plays in English or in the Chinese version, at their own level for the subject but never below their lowest level. Changes save straight away. A student in more than one class has one login, one set of points and words, and the same Version and Lowest level in every class.</p>' +
        '<p class="note" style="margin-top:6px">Points: English version · 中 Chinese version. This week starts on Monday ' + esc(r.weekStart) + '. ' +
        'A level shows once a student has answered 10 questions on that side. "Last active" is the last time the student played, or logged in.</p>'
        : '<p class="note">No students in this class yet.</p>');
    Array.prototype.forEach.call(view.querySelectorAll('[data-sort]'), function(b){ b.onclick = function(){
      var k = b.getAttribute('data-sort'); if (sortBy === k) sortDown = !sortDown; else { sortBy = k; sortDown = false; } showClass(id); }; });
    Array.prototype.forEach.call(view.querySelectorAll('[data-reset]'), function(b){ b.onclick = function(){
      if (!confirm('Make a new password for ' + b.getAttribute('data-name') + '? Their old password stops working and they are logged out on every device. Their progress is kept.')) return;
      b.disabled = true;
      call('/api/teacher/students/' + b.getAttribute('data-reset') + '/reset', {}).then(function(r2){ showCards(c.name, r2.students, '#/class/' + id, 'New password made.'); }).catch(fail());
    }; });
    document.getElementById('resetall').onclick = function(){
      if (!confirm('Make new passwords for everyone in ' + c.name + '? All the old passwords stop working. Progress is kept. Use this if the login cards are lost.')) return;
      this.disabled = true;
      call('/api/teacher/classes/' + id + '/reset-all', {}).then(function(r2){ showCards(c.name, r2.students, '#/class/' + id, 'New passwords made for the whole class.'); }).catch(fail());
    };
    document.getElementById('rename').onclick = function(){
      var n = prompt('New name for the class:', c.name); if (!n || n.trim() === c.name) return;
      call('/api/teacher/classes/' + id + '/rename', {name: n}).then(function(){ showClass(id); }).catch(fail());
    };
    document.getElementById('add').onclick = function(){ showAdd(id, c.name); };
    wireShare(id, c.name);
    Array.prototype.forEach.call(view.querySelectorAll('[data-remove]'), function(b){ b.onclick = function(){
      if (!confirm('Take ' + b.getAttribute('data-name') + ' out of ' + c.name + '? They stay in ' + b.getAttribute('data-also') + ' with the same login, points and words. Their scores in this class\'s games are kept, and you can add them back.')) return;
      b.disabled = true;
      call('/api/teacher/classes/' + id + '/members/remove', {id: +b.getAttribute('data-remove')}).then(function(){ showClass(id); }).catch(fail());
    }; });
    var shared = list.filter(function(s){ return s.alsoIn && s.alsoIn.length; }).length;
    var alsoNote = shared ? ' This also changes it in their other classes for the ' + shared + ' student' + (shared === 1 ? '' : 's') + ' who are in more than one class.' : '';
    var saved = function(){ var el = document.getElementById('saved'); if (el) { el.textContent = 'Saved'; setTimeout(function(){ if (el.textContent === 'Saved') el.textContent = ''; }, 1800); } };
    Array.prototype.forEach.call(view.querySelectorAll('[data-side]'), function(sel){ sel.onchange = function(){
      call('/api/teacher/students/' + sel.getAttribute('data-side') + '/settings', {side: sel.value}).then(saved).catch(fail()); }; });
    Array.prototype.forEach.call(view.querySelectorAll('[data-min]'), function(sel){ sel.onchange = function(){
      call('/api/teacher/students/' + sel.getAttribute('data-min') + '/settings', {minLevel: +sel.value || null}).then(saved).catch(fail()); }; });
    var allSide = document.getElementById('allSide'), allMin = document.getElementById('allMin');
    if (allSide) allSide.onchange = function(){ if (!allSide.value) return;
      if (!confirm('Put everyone in ' + c.name + ' on the ' + (allSide.value === 'zh' ? 'Chinese version' : 'English version') + '?' + alsoNote)) { allSide.value = ''; return; }
      call('/api/teacher/classes/' + id + '/settings', {side: allSide.value}).then(function(){ showClass(id); }).catch(fail()); };
    if (allMin) allMin.onchange = function(){ if (allMin.value === '') return;
      if (!confirm('Set the lowest level for everyone in ' + c.name + ' to ' + (allMin.options[allMin.selectedIndex].text) + '?' + alsoNote)) { allMin.value = ''; return; }
      call('/api/teacher/classes/' + id + '/settings', {minLevel: +allMin.value || null}).then(function(){ showClass(id); }).catch(fail()); };
  }).catch(function(x){ view.innerHTML = '<p><a class="backlink" href="#/">← Staff Room</a></p><p class="err">' + esc(x.message) + '</p>'; });
}

// Sharing the class with another teacher (only the teacher who made it). t: {mine, owner, shared: [{id, name}]}
function shareLine(t){
  if (!t) return '';   // an older server
  if (!t.mine) return '<div class="share-line"><p>Shared with you by <b>' + esc(t.owner) + '</b>. Only ' + esc(t.owner) + ' can change who it is shared with.</p></div>';
  return '<form class="share-line" id="sharef" novalidate>' +
    (t.shared.length ? '<p>Shared with ' + t.shared.map(function(x){ return '<span class="who"><b>' + esc(x.name) + '</b> <button class="btn small alt" type="button" data-unshare="' + x.id + '" data-name="' + esc(x.name) + '">Stop sharing</button></span>'; }).join(' ') + '</p>' : '') +
    '<label for="shu">' + (t.shared.length ? 'Share with another teacher' : 'Share this class with a teacher') + '</label>' +
    '<input type="text" id="shu" placeholder="Their username" autocomplete="off" autocapitalize="off" spellcheck="false">' +
    '<button class="btn small" type="submit">Share</button>' +
    '<span class="note">They see the students, their progress and the class games, and can do everything here except share the class.</span></form>';
}
function wireShare(id, name){
  var f = document.getElementById('sharef'); if (!f) return;
  f.onsubmit = function(e){
    e.preventDefault(); var u = document.getElementById('shu').value.trim(), b = f.querySelector('button[type=submit]');
    if (!u) { document.getElementById('shu').focus(); return; }
    b.disabled = true; document.getElementById('err').hidden = true;
    call('/api/teacher/classes/' + id + '/share', {username: u}).then(function(){ showClass(id); }).catch(fail());
  };
  Array.prototype.forEach.call(f.querySelectorAll('[data-unshare]'), function(b){ b.onclick = function(){
    if (!confirm('Stop sharing ' + name + ' with ' + b.getAttribute('data-name') + '? They will no longer see this class. Nothing in the class changes.')) return;
    b.disabled = true;
    call('/api/teacher/classes/' + id + '/unshare', {id: +b.getAttribute('data-unshare')}).then(function(){ showClass(id); }).catch(fail());
  }; });
}

function showAdd(id, name){
  setTitle('Add students to ' + name);
  view.innerHTML = '<form class="card narrow" id="f" style="max-width:620px">' + studentsFields() +
    '<p class="err" id="err" role="alert" hidden></p>' +
    '<div class="row"><button class="btn" type="submit">Add them</button><a class="btn alt" href="#/class/' + id + '">Cancel</a></div></form>';
  wireStudents(); document.getElementById('count').value = 1;
  document.getElementById('f').onsubmit = function(e){
    e.preventDefault(); this.querySelector('button').disabled = true; document.getElementById('err').hidden = true;
    call('/api/teacher/classes/' + id + '/students', studentsValue()).then(function(r){ showCards(name, r.students, '#/class/' + id, 'Students added.'); }).catch(fail());
  };
}

// Students from the teacher's other classes, to put in this class too (30 Oct): same login, points and words
function showExisting(id){
  header();
  Promise.all([call('/api/teacher/classes/' + id), call('/api/teacher/students')]).then(function(rs){
    var c = rs[0].class, inHere = {}, groups = {}, order = [];
    rs[0].students.forEach(function(s){ inHere[s.id] = true; });
    rs[1].students.forEach(function(s){
      if (inHere[s.id]) return;
      s.classes.forEach(function(k){ if (!groups[k.id]) { groups[k.id] = {name: k.name, list: []}; order.push(k.id); } groups[k.id].list.push(s); });
    });
    order.sort(function(a, b){ return groups[a].name.localeCompare(groups[b].name); });
    setTitle('Add to ' + c.name + ' from your other classes');
    var back = '#/class/' + id;
    if (!order.length) { view.innerHTML = '<div class="card narrow"><p>There is no one to add: everyone in your other classes is already in ' + esc(c.name) + '.</p><div><a class="btn" href="' + back + '">Back to ' + esc(c.name) + '</a></div></div>'; return; }
    view.innerHTML = '<form class="card" id="f" style="max-width:760px">' +
      '<p class="note">Tick the students you also teach in ' + esc(c.name) + '. They keep their login card, password, points and words, and see the class games of every class they are in.</p>' +
      '<div class="field"><label for="q">Find a name</label><input type="text" id="q" autocomplete="off" placeholder="Type part of a name"></div>' +
      order.map(function(k){ var g = groups[k];
        return '<fieldset class="card" style="padding:14px 16px;gap:8px" data-group><legend class="lab">' + esc(g.name) + '</legend>' +
          '<label class="choice"><input type="checkbox" data-all><span class="note">Everyone in ' + esc(g.name) + '</span></label>' +
          '<div class="grid2" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 14px">' + g.list.map(function(s){
            return '<label class="choice" data-n="' + esc(s.name.toLowerCase()) + '"><input type="checkbox" value="' + s.id + '"><span>' + esc(s.name) + '</span></label>'; }).join('') + '</div></fieldset>';
      }).join('') +
      '<p class="err" id="err" role="alert" hidden></p>' +
      '<div class="row"><button class="btn" type="submit" id="go" disabled>Add to ' + esc(c.name) + '</button><a class="btn alt" href="' + back + '">Cancel</a><span class="note" id="cnt"></span></div></form>';
    var boxes = function(){ return Array.prototype.slice.call(view.querySelectorAll('input[type=checkbox][value]')); };
    var count = function(){   // the same student can be listed under two classes: tick both, count once
      var ids = {}; boxes().forEach(function(b){ if (b.checked) ids[b.value] = true; });
      var n = Object.keys(ids).length; document.getElementById('go').disabled = !n;
      document.getElementById('cnt').textContent = n ? n + ' chosen' : ''; return Object.keys(ids).map(Number); };
    boxes().forEach(function(b){ b.onchange = function(){ boxes().forEach(function(o){ if (o.value === b.value) o.checked = b.checked; }); count(); }; });
    Array.prototype.forEach.call(view.querySelectorAll('[data-all]'), function(a){ a.onchange = function(){
      Array.prototype.forEach.call(a.closest('[data-group]').querySelectorAll('input[value]'), function(b){
        if (b.closest('label').hidden) return; b.checked = a.checked; b.onchange(); }); }; });
    document.getElementById('q').oninput = function(){ var q = this.value.trim().toLowerCase();
      Array.prototype.forEach.call(view.querySelectorAll('[data-n]'), function(l){ l.hidden = !!q && l.getAttribute('data-n').indexOf(q) < 0; }); };
    document.getElementById('f').onsubmit = function(e){
      e.preventDefault(); var ids = count(); if (!ids.length) return;
      document.getElementById('go').disabled = true; document.getElementById('err').hidden = true;
      call('/api/teacher/classes/' + id + '/members', {ids: ids}).then(function(){ location.hash = back; }).catch(fail());
    };
  }).catch(function(x){ view.innerHTML = '<p><a class="backlink" href="#/">← Staff Room</a></p><p class="err">' + esc(x.message) + '</p>'; });
}

// ---------- login cards: shown once, to print or copy ----------
function showCards(className, students, back, msg){
  lastCards = {className: className, students: students, back: back};
  setTitle('Login cards: ' + className);
  var text = students.map(function(s){ return s.name + '\t' + s.password; }).join('\n');
  view.innerHTML =
    '<div class="card" style="margin-bottom:16px">' +
      '<p class="warn">' + esc(msg) + ' Print or copy these passwords now: they are not shown again. (If they get lost, make new ones from the class page.)</p>' +
      '<div class="row"><button class="btn" type="button" id="print">Print the cards</button>' +
      '<button class="btn alt" type="button" id="copy">Copy as a list</button>' +
      '<a class="btn alt" href="' + back + '">Done</a></div>' +
      '<p class="note">Students log in at <b>' + SITE + '</b>, or with the <b>Log in</b> button at the top of any page. Names don\'t care about capitals or spaces.</p>' +
    '</div>' +
    '<div class="cards">' + students.map(function(s){
      return '<div class="lc"><span class="site">Academic English App · ' + esc(SITE) + '</span><span class="site">Class ' + esc(className) + '</span>' +
        '<span class="k">Name 名字</span><span class="v">' + esc(s.name) + '</span>' +
        '<span class="k">Password 密码</span><span class="pw">' + esc(s.password) + '</span></div>'; }).join('') + '</div>';
  document.getElementById('print').onclick = function(){ window.print(); };
  document.getElementById('copy').onclick = function(){
    var b = this, done = function(){ b.textContent = 'Copied'; };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, function(){ prompt('Copy this:', text); });
    else prompt('Copy this:', text);
  };
  window.scrollTo(0, 0);
}

// ---------- class games (29 Oct) ----------
// The teacher sets a game for the class: a subject, how many minutes, the score needed and (if they like) a due time.
// Each student plays it on their own device, at their level, in English or the Chinese version (set on the Students tab).
// Score: +1 for each right answer, -1 for each wrong one (never below 0). Below the score needed, a student can play again.
// The page for one game refreshes every 5 seconds, so the teacher can watch the class play.
var live = null;   // the refresh timer on a game's page
var stopLive = function(){ if (live) { clearTimeout(live); live = null; } };
var two = function(n){ return String(n).padStart(2, '0'); };
var clock = function(ms){ var s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + two(s % 60); };
var dueText = function(t){ if (!t) return 'no due time'; var d = new Date(t);
  return 'due ' + d.toLocaleDateString('en-GB', {weekday: 'short', day: 'numeric', month: 'short'}) + ' ' + two(d.getHours()) + ':' + two(d.getMinutes()); };
var localInput = function(t){ if (!t) return ''; var d = new Date(t);
  return d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate()) + 'T' + two(d.getHours()) + ':' + two(d.getMinutes()); };
var fromInput = function(v){ if (!v) return null; var t = new Date(v).getTime(); return isNaN(t) ? null : t; };

function showGames(id){
  header();
  call('/api/teacher/classes/' + id + '/games').then(function(r){
    var c = r.class; setTitle(c.name + ': class games');
    var card = function(g){ var n = g.counts;
      return '<a class="game-card' + (g.closed ? ' closed' : '') + '" href="#/game/' + g.id + '"><b>' + esc(g.name) + '</b>' +
        '<span class="note">' + g.minutes + ' minute' + (g.minutes === 1 ? '' : 's') + ' · pass: ' + g.minScore + ' · ' + esc(dueText(g.due)) + (g.closed ? ' · <b>closed</b>' : '') + '</span>' +
        '<span class="counts"><span><b>' + n.passed + '</b> passed' + (n.late ? ' (' + n.late + ' late)' : '') + '</span>' +
        (n.playing ? '<span><b>' + n.playing + '</b> playing</span>' : '') + (n.below ? '<span><b>' + n.below + '</b> below</span>' : '') +
        '<span><b>' + n.new + '</b> not started</span></span>' +
        '<span class="note">Set ' + esc(when(g.created)) + '</span></a>'; };
    view.innerHTML =
      '<div class="spread" style="margin-bottom:14px"><a class="backlink" href="#/">← Staff Room</a></div>' + classTabs(id, 'games') +
      '<form class="card" id="f" style="margin-bottom:18px"><h2>New class game</h2>' +
      '<div class="grid2">' +
        '<div class="field"><label for="g-sub">Subject</label><select id="g-sub">' + r.subjects.map(function(s){ return '<option value="' + esc(s.key) + '">' + esc(s.name) + '</option>'; }).join('') + '</select></div>' +
        '<div class="field"><label for="g-min">Minutes</label><input type="number" id="g-min" min="1" max="60" value="10"></div>' +
        '<div class="field"><label for="g-score">Score needed to pass</label><input type="number" id="g-score" min="0" max="10000" value="0"></div>' +
        '<div class="field"><label for="g-due">Due (optional)</label><input type="datetime-local" id="g-due"></div>' +
      '</div>' +
      '<p class="note">Every student plays the same mix of five games (quick, longer, arcade, longer, quick), at their own level for the subject but never below the lowest level on the Students tab, in English or the Chinese version. Score: +1 for each right answer, −1 for each wrong one. The clock keeps running once they start. Below the score needed, they can play again; after the due time they can still play, marked late.</p>' +
      '<p class="err" id="err" role="alert" hidden></p>' +
      '<div><button class="btn" type="submit">Set the game</button></div></form>' +
      (r.games.length ? '<div class="games-list">' + r.games.map(card).join('') + '</div>' : '<p class="note">No class games yet.</p>');
    document.getElementById('f').onsubmit = function(e){
      e.preventDefault(); this.querySelector('button').disabled = true; document.getElementById('err').hidden = true;
      call('/api/teacher/classes/' + id + '/games', {subject: document.getElementById('g-sub').value, minutes: +document.getElementById('g-min').value,
        minScore: +document.getElementById('g-score').value || 0, due: fromInput(document.getElementById('g-due').value)})
        .then(function(r2){ location.hash = '#/game/' + r2.game.id; }).catch(fail());
    };
  }).catch(function(x){ view.innerHTML = '<p><a class="backlink" href="#/">← Staff Room</a></p><p class="err">' + esc(x.message) + '</p>'; });
}

var gameSort = 'name';
function showGame(gid){
  header(); stopLive();
  var first = true, cid = null;
  var statusHtml = function(s){
    var late = s.late && s.status !== 'new' ? '<span class="st late">late</span>' : '';
    if (s.status === 'passed') return '<span class="st passed">Passed</span>' + late + (s.live ? ' <span class="st playing">playing again</span>' : '');
    if (s.status === 'playing') return '<span class="st playing">Playing · ' + clock(s.live.msLeft) + ' left</span>';
    if (s.status === 'below') return '<span class="st below">Below the score</span>' + late;
    return '<span class="st">Not started</span>' + (s.late ? '<span class="st late">overdue</span>' : '');
  };
  var draw = function(r){
    var g = r.game, list = r.students.slice(), n = {new: 0, playing: 0, passed: 0, below: 0};
    list.forEach(function(s){ n[s.status]++; });
    var rank = {playing: 0, passed: 1, below: 2, new: 3};
    list.sort(function(a, b){
      if (gameSort === 'score') return ((b.live ? b.live.score : b.score) || -1) - ((a.live ? a.live.score : a.score) || -1) || a.name.localeCompare(b.name);
      if (gameSort === 'status') return rank[a.status] - rank[b.status] || a.name.localeCompare(b.name);
      return a.name.toLowerCase() < b.name.toLowerCase() ? -1 : 1; });
    var rows = list.map(function(s){
      var sc = s.live ? s.live : s, side = s.side || s.setSide;
      return '<tr><td><b>' + esc(s.name) + '</b></td><td>' + statusHtml(s) + '</td>' +
        '<td class="num">' + (sc.score == null ? '<span class="muted">–</span>' : '<span class="big-num">' + sc.score + '</span>') + '</td>' +
        '<td class="num">' + (sc.right == null ? '<span class="muted">–</span>' : sc.right + ' / ' + sc.wrong) + '</td>' +
        '<td>' + (side === 'zh' ? '<span class="zh" lang="zh">中文版</span>' : 'English') + '</td>' +
        '<td>' + (s.level ? esc(LEVEL_LIST[s.level - 1]) : '<span class="muted">–</span>') + '</td>' +
        '<td class="num">' + (s.attempts || '<span class="muted">0</span>') + '</td>' +
        '<td>' + (s.finished ? when(s.finished) : '<span class="muted">–</span>') + '</td></tr>';
    }).join('');
    var sortBtn = function(k, label){ return '<th><button type="button" data-gsort="' + k + '">' + label + (gameSort === k ? ' ▾' : '') + '</button></th>'; };
    document.getElementById('gsum').innerHTML = '<span><b>' + n.passed + '</b> passed</span>' + (n.playing ? '<span><b>' + n.playing + '</b> playing</span>' : '') +
      '<span><b>' + n.below + '</b> below the score</span><span><b>' + n.new + '</b> not started</span>' + (g.closed ? '<span><b>Closed:</b> students can\'t see it</span>' : '');
    document.getElementById('gtable').innerHTML = list.length ? '<div class="tablewrap"><table><thead><tr>' + sortBtn('name', 'Student') + sortBtn('status', 'Status') + sortBtn('score', 'Score') +
      '<th>Right / wrong</th><th>Version</th><th>Level played</th><th>Goes</th><th>Finished</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<p class="note">No students in this class.</p>';
    Array.prototype.forEach.call(document.querySelectorAll('[data-gsort]'), function(b){ b.onclick = function(){ gameSort = b.getAttribute('data-gsort'); draw(r); }; });
  };
  var load = function(){
    stopLive();
    call('/api/teacher/games/' + gid).then(function(r){
      if (location.hash !== '#/game/' + gid) return;
      var g = r.game; cid = r.class.id;
      if (first) {
        first = false; setTitle(r.class.name + ': ' + g.name);
        view.innerHTML =
          '<div class="spread" style="margin-bottom:14px"><a class="backlink" href="#/class/' + cid + '/games">← ' + esc(r.class.name) + ': class games</a>' +
          '<div class="row"><button class="btn alt" type="button" id="gclose">' + (g.closed ? 'Open it again' : 'Close the game') + '</button>' +
          '<button class="btn alt" type="button" id="gdel">Delete</button></div></div>' +
          '<div class="card" style="margin-bottom:14px"><p class="note">' + g.minutes + ' minute' + (g.minutes === 1 ? '' : 's') + ' · set ' + esc(when(g.created).replace(/<[^>]+>/g, '')) + '. This page updates every 5 seconds.</p>' +
          '<div class="row"><label class="lab" for="gscore">Score needed</label><input type="number" id="gscore" min="0" max="10000" value="' + g.minScore + '">' +
          '<label class="lab" for="gdue">Due</label><input type="datetime-local" id="gdue" value="' + localInput(g.due) + '">' +
          '<button class="btn small" type="button" id="gsave">Save</button><span class="note" id="gsaved" aria-live="polite"></span></div>' +
          '<div class="counts" id="gsum"></div></div>' +
          '<p class="err" id="err" role="alert" hidden></p><div id="gtable"></div>' +
          '<p class="note" style="margin-top:10px">Score: +1 for each right answer, −1 for each wrong one. While a student is playing, their score so far shows. ' +
          'A student who passed keeps the score of the go that passed; otherwise their best go shows. Late: passed after the due time (or not started by then).</p>';
        document.getElementById('gsave').onclick = function(){
          call('/api/teacher/games/' + gid, {minScore: +document.getElementById('gscore').value || 0, due: fromInput(document.getElementById('gdue').value)})
            .then(function(){ var el = document.getElementById('gsaved'); el.textContent = 'Saved'; load(); }).catch(fail());
        };
        document.getElementById('gclose').onclick = function(){
          var closing = !g.closed;
          if (closing && !confirm('Close this game? Students stop seeing it, and anyone playing can\'t start again. The scores are kept, and you can open it again.')) return;
          call('/api/teacher/games/' + gid, {closed: closing}).then(function(){ first = true; load(); }).catch(fail());
        };
        document.getElementById('gdel').onclick = function(){
          if (!confirm('Delete this game and all its scores? This can\'t be undone. (Closing it keeps the scores.)')) return;
          call('/api/teacher/games/' + gid + '/delete', {}).then(function(){ location.hash = '#/class/' + cid + '/games'; }).catch(fail());
        };
      }
      draw(r);
      live = setTimeout(load, document.hidden ? 15000 : 5000);
    }).catch(function(x){ if (first) view.innerHTML = '<p><a class="backlink" href="#/">← Staff Room</a></p><p class="err">' + esc(x.message) + '</p>';
      else live = setTimeout(load, 10000); });
  };
  load();
}

// ---------- reports (31 Oct 2026) ----------
// Questions students (or you) reported after a wrong answer, grouped by question, most-reported first.
// Keep: it stays in the games (a new report brings it back here). Remove: every game stops showing it straight away,
// until Put back. Content files are not changed: the Removed list is what to fix or delete in content/.
var REASON_NAMES = {answer: 'My answer should be right', unclear: "Doesn't make sense", other: 'Something else'};
var repData = null;
function repTab(){ var m = /^#\/reports\/(removed|kept)$/.exec(location.hash); return m ? m[1] : 'open'; }
function repCard(g, tab){
  var reasons = Object.keys(REASON_NAMES).filter(function(k){ return g.reasons[k]; })
    .map(function(k){ return esc(REASON_NAMES[k]) + (g.reasons[k] > 1 ? ' ×' + g.reasons[k] : ''); }).join(' · ');
  var comments = g.reports.filter(function(r){ return r.comment; });
  var who = []; g.reports.forEach(function(r){ if (who.indexOf(r.who) < 0) who.push(r.who); });
  var key = esc(JSON.stringify({topic: g.topic, game: g.game, item: g.item}));
  var btns = tab === 'removed'
    ? '<button class="btn small alt" data-do="kept" data-q="' + key + '">Put back</button>'
    : (tab === 'open' ? '<button class="btn small" data-do="kept" data-q="' + key + '">Keep</button>' : '') +
      '<button class="btn small ' + (tab === 'open' ? 'danger' : 'alt') + '" data-do="removed" data-q="' + key + '">Remove</button>';
  return '<div class="card rep">' +
    '<div class="spread"><b class="rep-name">' + esc(g.pageName || g.topic) + ' · ' + esc(g.gameName || g.game) + '</b>' +
      '<span><span class="st' + (tab === 'open' ? ' below' : '') + '">' + g.count + ' report' + (g.count === 1 ? '' : 's') + '</span>' +
      (g.keptBefore ? ' <span class="st">kept before</span>' : '') + '</span></div>' +
    '<pre class="rep-shown">' + esc(g.shown || '(no text)') + '</pre>' +
    (g.chosen.length ? '<p><span class="lab">Chosen:</span> ' + esc(g.chosen.join(' · ')) + '</p>' : '') +
    (g.feedback ? '<p class="note"><span class="lab">The game said:</span> ' + esc(g.feedback) + '</p>' : '') +
    '<p><span class="lab">Why:</span> ' + reasons + '</p>' +
    (comments.length ? '<ul class="rep-comments">' + comments.map(function(r){ return '<li>“' + esc(r.comment) + '” <span class="note">' + esc(r.who) + ', ' + when(r.created) + '</span></li>'; }).join('') + '</ul>' : '') +
    '<p class="note">From ' + esc(who.join(', ')) + ' · last ' + when(g.last) + (g.level ? ' · ' + esc(g.level) : '') + ' · ' + esc(g.topic) + ' / ' + esc(g.item) +
      (tab !== 'open' && g.decided ? ' · ' + (tab === 'removed' ? 'removed ' : 'kept ') + when(g.decided) : '') + '</p>' +
    '<div class="spread"><span class="rep-btns">' + btns + '</span>' +
      (g.page ? '<a class="note" href="../' + esc(g.page) + '#play-' + esc(g.game) + '" target="_blank" rel="noopener">Open this game ↗</a>' : '') + '</div>' +
    '</div>';
}
function repCsv(){
  var q = function(v){ v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  var d = function(t){ return t ? new Date(t).toLocaleString('en-GB') : ''; };
  var head = ['Status', 'Page', 'Game', 'Content folder', 'Question id', 'Reports', 'My answer should be right', "Doesn't make sense", 'Something else',
    'Comments', 'Question as shown', 'Chosen', 'The game said', 'Level', 'From', 'First report', 'Last report', 'Decided'];
  var rows = [];
  [['open', 'Open'], ['removed', 'Removed'], ['kept', 'Kept']].forEach(function(t){
    (repData[t[0]] || []).forEach(function(g){
      var who = []; g.reports.forEach(function(r){ if (who.indexOf(r.who) < 0) who.push(r.who); });
      rows.push([t[1], g.pageName, g.gameName, g.topic, g.item, g.count, g.reasons.answer || 0, g.reasons.unclear || 0, g.reasons.other || 0,
        g.reports.filter(function(r){ return r.comment; }).map(function(r){ return r.comment + ' (' + r.who + ')'; }).join('\n'),
        g.shown, g.chosen.join(' | '), g.feedback, g.level, who.join(', '), d(g.first), d(g.last), d(g.decided)]);
    });
  });
  var text = '﻿' + [head].concat(rows).map(function(r){ return r.map(q).join(','); }).join('\r\n');
  var a = document.createElement('a'), url = URL.createObjectURL(new Blob([text], {type: 'text/csv;charset=utf-8'}));
  var now = new Date();
  a.href = url; a.download = 'reports-' + now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0') + '.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function showReports(){
  setTitle('Reports'); header();
  var tab = repTab();
  call('/api/teacher/reports').then(function(r){
    repData = r;
    var list = r[tab] || [], tabs = [['open', 'To check', r.open.length], ['removed', 'Removed', r.removed.length], ['kept', 'Kept', r.kept.length]];
    var intro = {
      open: 'Questions students reported after a wrong answer, most reports first. <b>Keep</b> leaves it in the games. <b>Remove</b> takes it out of every game straight away.',
      removed: 'Taken out of the games. The rows are still in the content files: this is the list to fix or delete. <b>Put back</b> returns a question to the games.',
      kept: 'Questions you decided to keep (the last 200). A new report brings a question back to "To check".'}[tab];
    view.innerHTML =
      '<div class="spread" style="margin-bottom:14px"><a class="backlink" href="#/">← Staff Room</a>' +
        '<button class="btn small alt" type="button" id="csv"' + (r.open.length + r.removed.length + r.kept.length ? '' : ' disabled') + '>Download as spreadsheet</button></div>' +
      '<nav class="tabs">' + tabs.map(function(t){ return '<a href="#/reports' + (t[0] === 'open' ? '' : '/' + t[0]) + '"' + (t[0] === tab ? ' aria-current="page"' : '') + '>' + t[1] + ' (' + t[2] + ')</a>'; }).join('') + '</nav>' +
      '<p class="note" style="margin-bottom:14px">' + intro + '</p>' +
      '<p class="err" id="err" hidden></p>' +
      (list.length ? '<div class="reps">' + list.map(function(g){ return repCard(g, tab); }).join('') + '</div>'
        : '<p class="note">' + (tab === 'open' ? 'Nothing to check. 🎉' : 'None yet.') + '</p>');
    document.getElementById('csv').onclick = repCsv;
    Array.prototype.forEach.call(view.querySelectorAll('[data-do]'), function(b){
      b.onclick = function(){
        var q = JSON.parse(b.getAttribute('data-q')), status = b.getAttribute('data-do');
        b.disabled = true;
        call('/api/teacher/reports/decide', {topic: q.topic, game: q.game, item: q.item, status: status}).then(showReports).catch(fail());
      };
    });
  }).catch(function(x){ view.innerHTML = '<p><a class="backlink" href="#/">← Staff Room</a></p><p class="err">' + esc(x.message) + '</p>'; });
}

// ---------- suggestions (3 Nov 2026) ----------
// A student asked for a suggestions box: logged-in students send ideas from the bottom of the topic lists (3 a day each).
// New: oldest first. Done: you've read it or acted on it (the last 300). Delete: for silly ones.
var KIND_NAMES = {game: '🎮 A new game', topic: '📚 A new topic or words', problem: "🔧 Something isn't working", other: '💬 Something else'};
var sgData = null;
function sgTab(){ return location.hash === '#/suggestions/done' ? 'done' : 'new'; }
function sgCard(x, tab){
  return '<div class="card sg-card">' +
    '<div class="spread"><span class="sg-kindtag">' + esc(KIND_NAMES[x.kind] || x.kind) + '</span>' +
      '<span class="note">' + when(x.created) + (x.side === 'zh' ? ' · Chinese version' : '') + '</span></div>' +
    '<p class="sg-said">' + esc(x.text) + '</p>' +
    '<p class="note">From <b>' + esc(x.name) + '</b>' + (x.classes ? ' · ' + esc(x.classes) : '') +
      (tab === 'done' && x.done ? ' · done ' + when(x.done) : '') + '</p>' +
    '<div class="rep-btns">' + (tab === 'new'
      ? '<button class="btn small" data-sg="done" data-id="' + x.id + '">Done ✓</button>'
      : '<button class="btn small alt" data-sg="new" data-id="' + x.id + '">Move back to New</button>') +
      '<button class="btn small alt" data-sg="delete" data-id="' + x.id + '">Delete</button></div>' +
    '</div>';
}
function sgCsv(){
  var q = function(v){ v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  var d = function(t){ return t ? new Date(t).toLocaleString('en-GB') : ''; };
  var rows = [['Status', 'About', 'Suggestion', 'From', 'Class', 'Version', 'Sent', 'Done']];
  [['new', 'New'], ['done', 'Done']].forEach(function(t){
    (sgData[t[0]] || []).forEach(function(x){
      rows.push([t[1], (KIND_NAMES[x.kind] || x.kind).replace(/^\S+\s/, ''), x.text, x.name, x.classes, x.side === 'zh' ? 'Chinese' : 'English', d(x.created), d(x.done)]);
    });
  });
  var text = '﻿' + rows.map(function(r){ return r.map(q).join(','); }).join('\r\n');
  var a = document.createElement('a'), url = URL.createObjectURL(new Blob([text], {type: 'text/csv;charset=utf-8'}));
  var now = new Date();
  a.href = url; a.download = 'suggestions-' + now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0') + '.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function showSuggestions(){
  setTitle('Suggestions'); header();
  var tab = sgTab();
  call('/api/teacher/suggestions').then(function(r){
    sgData = r;
    var list = r[tab] || [], tabs = [['new', 'New', r.new.length], ['done', 'Done', r.done.length]];
    var intro = tab === 'new'
      ? 'Ideas students sent from the suggestions box at the bottom of the topic lists, oldest first. Press <b>Done</b> when you have read it or acted on it.'
      : 'Suggestions you have marked done (the last 300).';
    view.innerHTML =
      '<div class="spread" style="margin-bottom:14px"><a class="backlink" href="#/">← Staff Room</a>' +
        '<button class="btn small alt" type="button" id="csv"' + (r.new.length + r.done.length ? '' : ' disabled') + '>Download as spreadsheet</button></div>' +
      '<nav class="tabs">' + tabs.map(function(t){ return '<a href="#/suggestions' + (t[0] === 'new' ? '' : '/done') + '"' + (t[0] === tab ? ' aria-current="page"' : '') + '>' + t[1] + ' (' + t[2] + ')</a>'; }).join('') + '</nav>' +
      '<p class="note" style="margin-bottom:14px">' + intro + '</p>' +
      '<p class="err" id="err" hidden></p>' +
      (list.length ? '<div class="reps">' + list.map(function(x){ return sgCard(x, tab); }).join('') + '</div>'
        : '<p class="note">' + (tab === 'new' ? 'No new suggestions.' : 'None yet.') + '</p>');
    document.getElementById('csv').onclick = sgCsv;
    Array.prototype.forEach.call(view.querySelectorAll('[data-sg]'), function(b){
      b.onclick = function(){
        var what = b.getAttribute('data-sg'), id = b.getAttribute('data-id');
        if (what === 'delete' && !confirm('Delete this suggestion? It can\'t be brought back.')) return;
        b.disabled = true;
        call('/api/teacher/suggestions/' + id + (what === 'delete' ? '/delete' : '/status'), what === 'delete' ? {} : {status: what}).then(showSuggestions).catch(fail());
      };
    });
  }).catch(function(x){ view.innerHTML = '<p><a class="backlink" href="#/">← Staff Room</a></p><p class="err">' + esc(x.message) + '</p>'; });
}

function route(){
  stopLive();
  if (window.AEA_BOARD) AEA_BOARD.stop();
  if (window.AEA_START) AEA_START.stop();
  if (!auth()) return showLogin();
  var h = location.hash, m;
  if (h === '#/new') return showNew();
  if (h === '#/password') return showPassword();
  if ((m = /^#\/class\/(\d+)$/.exec(h))) return showClass(m[1]);
  if ((m = /^#\/class\/(\d+)\/games$/.exec(h))) return showGames(m[1]);
  if ((m = /^#\/class\/(\d+)\/existing$/.exec(h))) return showExisting(m[1]);
  if ((m = /^#\/game\/(\d+)$/.exec(h))) return showGame(m[1]);
  if (/^#\/reports(\/(removed|kept))?$/.test(h)) return showReports();
  if (h === '#/suggestions' || h === '#/suggestions/done') return showSuggestions();
  if (/^#\/board(\/|$)/.test(h) && window.AEA_BOARD) return AEA_BOARD.route(h, {view: view, setTitle: setTitle, header: header, touch: stillHere});
  if (/^#\/starters(\/|$)/.test(h) && window.AEA_START) return AEA_START.route(h, {view: view, setTitle: setTitle, header: header, touch: stillHere});
  if (h === '#/handouts' && window.AEA_HANDOUT) return AEA_HANDOUT.route(h, {view: view, setTitle: setTitle, header: header, touch: stillHere});
  showClasses();
}
addEventListener('hashchange', route);
// A link to the view's own address (e.g. Done after resetting a password) still redraws the view
document.addEventListener('click', function(e){
  var a = e.target.closest && e.target.closest('a[href^="#"]');
  if (a && a.getAttribute('href') === (location.hash || '#/')) { e.preventDefault(); route(); }
});
// Leaving with passwords on screen that haven't been printed: ask first
addEventListener('beforeunload', function(e){ if (lastCards && /^Login cards/.test(title.textContent)) { e.preventDefault(); e.returnValue = ''; } });
route();
})();
</script>
