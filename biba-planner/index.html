    writeConfig('prefs', pr); toast(`Added ${name}`); return;
  }
  if (d.delduty) { const pr = clone(prefs()); const du = (pr.duties || []).find(x => x.id === d.delduty); pr.duties = (pr.duties || []).filter(x => x.id !== d.delduty); writeConfig('prefs', pr); toast(`Removed ${du ? dutyLabel(du) : 'duty'}`); return; }
  if (d.tadd != null) {
    const ok = addTask($('#tTitle').value, $('#tCls').value, $('#tDue').value);
    if (ok) { taskDraft = { title: '', cls: $('#tCls').value, due: '' }; renderMainOnly(); const f = $('#tTitle'); if (f) f.focus(); }
    return;
  }
  if (d.tnext) {
    const pre = d.tnext === 'new' ? 't' : 'te', cls = $('#' + pre + 'Cls').value;
    if (!cls) { toast('Choose a class first.'); return; }
    const nd = nextLessonDate(cls, todayDS());
    if (!nd) { toast(`No upcoming ${cinfo(cls).name} lessons found.`); return; }
    $('#' + pre + 'Due').value = nd; if (pre === 't') taskDraft.due = nd;
    toast(`Next ${cinfo(cls).name} lesson: ${fmtShort(nd)}`); return;
  }
  if (d.tedit) { taskEdit = d.tedit; renderMainOnly(); const f = $('#teTitle'); if (f) { f.focus(); f.select(); } return; }
  if (d.tcancel != null) { taskEdit = null; renderMainOnly(); return; }
  if (d.tsave) {
    const t = S.tasks.get(d.tsave), title = $('#teTitle').value.trim();
    if (!title) { toast('A task needs some text.'); return; }
    taskEdit = null; writeTask(d.tsave, { ...t, title: title.slice(0, 200), cls: $('#teCls').value, due: isDS($('#teDue').value) ? $('#teDue').value : '' }); return;
  }
  if (d.tdel) { const t = S.tasks.get(d.tdel); taskEdit = null; writeTask(d.tdel, null); toast(`Deleted “${(t && t.title || '').slice(0, 40)}”`); if (S.drawer) S.drawer.force = true; return; }
  if (d.tshowdone != null) { ui.showDone = !ui.showDone; saveUI(); renderMainOnly(); return; }
  if (d.tclearno != null) { clearArmed = false; renderMainOnly(); return; }
  if (d.tclear != null) {
    if (!clearArmed) { clearArmed = true; renderMainOnly(); return; }
    clearArmed = false;
    const done = liveTasks().filter(t => t.done && (!ui.classes.length || ui.classes.includes(t.cls)));
    for (const t of done) S.tasks.set(t.id, { id: t.id, deleted: true, updatedAt: Date.now() });
    changed(); render(); toast(`Cleared ${done.length} done task${done.length === 1 ? '' : 's'}`); return;
  }
  if (d.dtaskadd) {
    const inp = $('#dTaskTitle');
    if (addTask(inp.value, d.dtaskadd, d.date)) { S.drawer.force = true; render(); const f = $('#dTaskTitle'); if (f) f.focus(); }
    return;
  }
  if (d.gosync != null) { location.hash = 'setup'; setView('setup'); setTimeout(() => { const el = document.getElementById('sync'); if (el) el.scrollIntoView({ block: 'start' }); }, 30); return; }
  if (d.syncnow != null) { SYNC.dirty ? pushRemote() : pullRemote(); return; }
  if (d.ghoff != null) { disconnectGitHub(); toast('Disconnected this device'); return; }
  if (d.ghconnect != null) {
    const owner = $('#ghOwner').value.trim().replace(/^@/, ''), repo = $('#ghRepo').value.trim().replace(/\.git$/, ''), token = $('#ghToken').value.trim();
    if (!owner || !repo || !token) { ghForm.err = 'Fill in your username, the repository and the token.'; renderMainOnly(); return; }
    ghForm = { busy: true, err: '' }; renderMainOnly();
    connectGitHub({ owner, repo, token, path: 'planner.json' })
      .then(isPrivate => { ghForm = { busy: false, err: '' }; render(); toast(isPrivate ? 'Connected to GitHub' : 'Connected. That repository is public, so anyone can read your plans; consider making it private.'); })
      .catch(e => { ghForm = { busy: false, err: e.message }; SYNC.cfg = null; try { localStorage.removeItem(GH_KEY); } catch {} renderMainOnly(); });
    return;
  }
  if (d.open != null) { if (d.open) openLesson(d.open); return; }
  if (d.anchor) { setAnchor(d.date, +d.anchor); return; }
  if (d.all != null) { ui.classes = []; saveUI(); render(); return; }
  if (d.subj) { const t2 = classes().list.filter(c => c.subject === d.subj).map(c => c.title); const on = t2.length === ui.classes.length && t2.every(x => ui.classes.includes(x)); ui.classes = on ? [] : t2; saveUI(); render(); return; }
  if (d.cls) { const i = ui.classes.indexOf(d.cls); if (i >= 0) ui.classes.splice(i, 1); else ui.classes.push(d.cls); saveUI(); render(); return; }
  if (d.wk) { S.weekStart = d.wk === '0' ? mondayOf(todayDS()) : addDays(S.weekStart, 7 * +d.wk); render(); return; }
  if (d.mo) {
    if (d.mo === '0') S.monthStart = todayDS().slice(0, 8) + '01';
    else { const [y, m] = S.monthStart.split('-').map(Number); const dt = new Date(Date.UTC(y, m - 1 + +d.mo, 1)); S.monthStart = toDS(dt); }
    render(); return;
  }
  if (d.goweek) { S.weekStart = mondayOf(d.goweek); location.hash = 'week'; setView('week'); return; }
  if (d.day) { flushDraft(); S.drawer = { kind: 'day', date: d.day, force: true }; render(); return; }
  if (d.lm) { ui.listMode = d.lm; S.listCount = 15; saveUI(); render(); return; }
  if (d.more != null) { S.listCount += 15; render(); return; }
  if (d.cover) { const p = clone(prefs()); p.covered = (p.covered || []).filter(x => x !== d.cover); if (d.v === 'other') p.covered.push(d.cover); writeConfig('prefs', p); return; }
  if (d.setanchor != null) { const dt = $('#anDate').value, dy = +$('#anDay').value; if (!isDS(dt)) { toast('Pick a date first.'); return; } setAnchor(dt, dy); return; }
  if (d.delanchor) { const c = clone(cal()); c.anchors = (c.anchors || []).filter(a => a.date !== d.delanchor); writeConfig('calendar', c); return; }
  if (d.addentry != null) {
    const s = $('#hStart').value, en = $('#hEnd').value || s, lab = $('#hLabel').value.trim(), ty = $('#hType').value;
    if (!isDS(s)) { toast('Pick a start date.'); return; }
    if (en < s) { toast('The end date is before the start date.'); return; }
    addEntries([{ start: s, end: en, label: lab || (ty === 'workday' ? 'Make-up school day' : 'Holiday'), type: ty }]);
    return;
  }
  if (d.delentry) { const c = clone(cal()); c.entries = (c.entries || []).filter(x => x.id !== d.delentry); writeConfig('calendar', c); toast('Removed'); return; }
  if (d.clearyear) { importState.clearYear = d.clearyear; render(); return; }
  if (d.clearyes != null) { const y = importState.clearYear; const c = clone(cal()); c.entries = (c.entries || []).filter(x => schoolYearOf(x.start) !== y); importState.clearYear = null; writeConfig('calendar', c); toast(`Cleared ${y}`); return; }
  if (d.clearno != null) { importState.clearYear = null; render(); return; }
  if (d.holparse != null) {
    importState.holText = $('#holText').value; importState.holErr = '';
    const found = parseHolidayText(importState.holText);
    if (found.length) importState.hol = found;
    else importState.holErr = importState.holText.trim() ? 'No dates found. Write dates as 2027-02-05, or 5 Feb 2027.' : 'Paste some holiday lines or upload a file first.';
    render(); return;
  }
  if (d.holcancel != null) { importState.hol = null; render(); return; }
  if (d.holadd != null) { const pick = importState.hol.filter(x => x.keep !== false); importState.hol = null; importState.holText = ''; addEntries(pick); return; }
  if (d.ttsave != null) {
    const tt = importState.tt; importState.tt = null;
    writeConfig('timetable', { ...tt, source: importState.ttName || 'timetable.pdf', importedAt: new Date().toISOString() });
    const ids = new Set(tt.slots.map(s => s.id)); const p = clone(prefs()); const kept = (p.covered || []).filter(x => ids.has(x));
    if (kept.length !== (p.covered || []).length) writeConfig('prefs', { ...p, covered: kept });
    toast('Timetable updated'); return;
  }
  if (d.ttcancel != null) { importState.tt = null; render(); return; }
  if (d.orph) {
    const o = orphans().find(x => x.key === d.key); if (!o) return;
    if (d.orph === 'del') { writeLesson(o.key, null); render(); toast('Plan deleted'); return; }
    reflowOrphan(o, d.orph === 'free' ? 'free' : 'shift'); return;
  }
  if (d.push != null) { flushDraft(); S.drawer.confirm = 'push'; S.drawer.force = true; render(); return; }
  if (d.pushno != null) { S.drawer.confirm = null; S.drawer.force = true; render(); return; }
  if (d.pushyes != null) {
    const key = S.drawer.key; const o = occByKey(key);
    S.drawer.confirm = null;
    if (!o) { toast('This lesson is no longer on the timetable.'); render(); return; }
    pushBackFrom(o.slot.title, key).then(() => toast('Plans shifted back one lesson'));
    S.drawer.force = true; render(); return;
  }
  if (d.clearplan != null) { flushDraft(); S.drawer.confirm = 'clear'; S.drawer.force = true; render(); return; }
  if (d.clearplanyes != null) { writeLesson(S.drawer.key, null); S.drawer.confirm = null; S.drawer.force = true; S.drawer.status = 'Cleared'; render(); return; }
  if (d.setday) { setAnchor(S.drawer.date, +d.setday); return; }
  if (d.dayhol != null) { const lab = ($('#dHolName') || {}).value || ''; addEntries([{ start: S.drawer.date, end: S.drawer.date, label: lab.trim() || 'Day off', type: 'holiday' }]); S.drawer.force = true; return; }
  if (d.daywork != null) { addEntries([{ start: S.drawer.date, end: S.drawer.date, label: 'Make-up school day', type: 'workday' }]); S.drawer.force = true; return; }
  if (d.dayrmhol) { const c = clone(cal()); c.entries = (c.entries || []).filter(x => x.id !== d.dayrmhol); writeConfig('calendar', c); S.drawer.force = true; return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'tTitle') { e.preventDefault(); $('[data-tadd]').click(); return; }
  if (e.key === 'Enter' && e.target.id === 'dTaskTitle') { e.preventDefault(); $('[data-dtaskadd]').click(); return; }
  if (e.key === 'Enter' && ['teTitle', 'teDue'].includes(e.target.id)) { e.preventDefault(); $('[data-tsave]').click(); return; }
  if (e.key === 'Escape' && taskEdit) { taskEdit = null; renderMainOnly(); return; }
  if (e.key === 'Escape' && S.drawer) { closeDrawer(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.lrow[data-open]')) { e.preventDefault(); openLesson(e.target.dataset.open); }
});
document.addEventListener('input', e => {
  if (['fTitle', 'fNotes', 'fLink'].includes(e.target.id)) {
    clearTimeout(draftTimer); draftTimer = setTimeout(flushDraft, 900);
    if (e.target.id === 'fLink') { const u = safeUrl(e.target.value.trim()); $('#linkOut').innerHTML = u ? `<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">Open link ↗</a>` : ''; }
  }
  if (e.target.id === 'holText') importState.holText = e.target.value;
  if (e.target.id === 'tTitle') taskDraft.title = e.target.value;
  if (e.target.id === 'duName') dutyForm.name = e.target.value;
  if (e.target.id === 'duPlace') dutyForm.place = e.target.value;
});
document.addEventListener('change', e => {
  if (e.target.id === 'mineOnly') { ui.mineOnly = e.target.checked; saveUI(); render(); }
  if (e.target.dataset.tdone) {
    const t = S.tasks.get(e.target.dataset.tdone); if (!t) return;
    writeTask(t.id, { ...t, done: e.target.checked, doneAt: e.target.checked ? Date.now() : null });
    if (S.drawer) { S.drawer.force = true; render(); }
    if (e.target.checked) toast('Done');
  }
  if (e.target.id === 'tCls') taskDraft.cls = e.target.value;
  if (e.target.id === 'duRepeat') dutyForm.repeat = e.target.value;
  if (e.target.id === 'duSlot') { dutyForm.slot = e.target.value; const [a, b] = slotTimes(dutyForm.slot); $('#duStart').value = a; $('#duEnd').value = b; }
  if (e.target.id === 'tDue') taskDraft.due = e.target.value;
  if (e.target.id === 'ttFile' && e.target.files[0]) handleTimetableFile(e.target.files[0]);
  if (e.target.id === 'holFile' && e.target.files[0]) handleHolidayFile(e.target.files[0]);
  if (e.target.dataset.hpick != null && importState.hol) { importState.hol[+e.target.dataset.hpick].keep = e.target.checked; render(); }
  if (e.target.id === 'coverName') { const v = e.target.value.trim() || 'Head'; writeConfig('prefs', { ...clone(prefs()), coverName: v.slice(0, 30) }); }
});
['dragover', 'dragleave', 'drop'].forEach(type => document.addEventListener(type, e => {
  const zone = e.target.closest && e.target.closest('.drop'); if (!zone) return;
  e.preventDefault();
  zone.classList.toggle('over', type === 'dragover');
  if (type === 'drop' && e.dataTransfer.files[0]) (zone.id === 'ttDrop' ? handleTimetableFile : handleHolidayFile)(e.dataTransfer.files[0]);
}));
window.addEventListener('beforeunload', flushDraft);
document.addEventListener('visibilitychange', () => { if (document.hidden) flushDraft(); });

function setAnchor(date, day) {
  const c = clone(cal()); c.anchors = (c.anchors || []).filter(a => a.date !== date); c.anchors.push({ date, day });
  writeConfig('calendar', { anchors: c.anchors, entries: c.entries || [] });
  toast(`${fmtShort(date)} set as Day ${day}`);
}
function addEntries(list) {
  const c = clone(cal()); c.entries = c.entries || []; c.anchors = c.anchors || [];
  let n = 0;
  for (const e of list) {
    if (c.entries.some(x => x.start === e.start && x.end === e.end && x.type === e.type)) continue;
    c.entries.push({ id: uid(), start: e.start, end: e.end || e.start, label: e.label, type: e.type }); n++;
  }
  writeConfig('calendar', c);
  toast(n ? `Added ${n} date${n > 1 ? 's' : ''}` : 'Those dates were already there');
}

/* ---------- boot ---------- */
if (location.hash) ui.view = location.hash.slice(1);
if (!VIEWS.includes(ui.view)) ui.view = 'week';
if (ui.view !== 'setup') returnView = ui.view;
render();
initStore();
setInterval(() => { if (!S.drawer) renderToday(); }, 60000);
})();
</script>
</body>
</html>
