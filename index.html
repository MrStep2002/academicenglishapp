<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Academic English App</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/home.css">
</head>
<body>
<main class="home">
  <!-- Header image: images/header.jpg (1600 × 600). -->
  <figure class="banner">
    <img src="images/header.jpg" alt="Students learning academic words such as explain, compare, evidence and create" onerror="this.parentNode.classList.add('missing')">
    <figcaption>Header image goes here: images/header.jpg</figcaption>
  </figure>

  <header class="intro">
    <p class="eyebrow">Academic English App</p>
    <h1>Choose your games</h1>
    <p class="sub">Pick a set of games to play. Your progress is saved on this device.</p>
  </header>

  <nav class="units" aria-label="Games">
    <a class="unit unit-rep" href="y8media/index.html">
      <span class="unit-num">Y8</span>
      <span class="unit-text">
        <span class="unit-name">Year 8 Media Games</span>
        <span class="unit-sub">Website and web design words for Year 8 Media.</span>
      </span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="unit unit-web" href="english-games/index.html">
      <span class="unit-num">En</span>
      <span class="unit-text">
        <span class="unit-name">English Games</span>
        <span class="unit-sub">The Golden 100 words for IGCSE English (0500) and World Literature (0408).</span>
      </span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </nav>

  <!-- Hidden for now: the Year 9 Media Studies versions. To bring them back, move this block back into a <nav class="units">.
  <header class="intro">
    <p class="eyebrow">Year 9 Media Studies</p>
    <h1>Choose your version</h1>
    <p class="sub">Pick the one that matches your English. You can switch later.</p>
  </header>

  <nav class="units" aria-label="Versions">
    <a class="unit unit-rep" href="zh/index.html" data-track="zh">
      <span class="unit-num" lang="zh">中</span>
      <span class="unit-text">
        <span class="unit-name">Chinese version <span lang="zh">中文版</span></span>
        <span class="unit-sub">Learn the words with Chinese support and build up to B1. <span lang="zh">借助中文学习单词，逐步达到 B1 水平。</span></span>
        <span class="last-used" hidden>Last used</span>
      </span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="unit unit-web" href="en/index.html" data-track="en">
      <span class="unit-num">En</span>
      <span class="unit-text">
        <span class="unit-name">English version</span>
        <span class="unit-sub">Academic English for analysis, from B1/B2: precise vocabulary, sentences and accurate writing.</span>
        <span class="last-used" hidden>Last used</span>
      </span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </nav>
  -->
</main>
<script>
  // Mark the version this device used last.
  try {
    var t = (JSON.parse(localStorage.getItem("mediaVocabY9V1")) || {}).settings.track;
    var a = t && document.querySelector('[data-track="' + t + '"] .last-used');
    if (a) a.hidden = false;
  } catch (e) {}
</script>
</body>
</html>
