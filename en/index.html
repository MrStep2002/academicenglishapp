<body class="aea-page">
<!-- The English home page (redesign stage 1, 8 Nov 2026). en/engine/home.js draws it from the subject list
     (en/engine/subjects.js: add new topics there, not here) and the student's progress; en/engine/shell.js adds the
     sidebar and the top bar. Class games appear in [data-class-games] (classgame.js), suggestions in [data-suggest]. -->
<main class="aea-wrap" data-home>
  <section class="aea-hello" data-h="hello" aria-label="Welcome"><h1 class="aea-h1">Welcome</h1></section>
  <div class="aea-classes" data-class-games></div>
  <section class="aea-row" data-h="today" aria-label="Today"></section>
  <!-- Your subjects (11 Nov 2026): the subjects ticked in Subjects (the sidebar), in their areas, four across. More subjects is gone. -->
  <section class="aea-sec-wrap" id="subjects" aria-labelledby="mine-h">
    <div class="aea-sec-top"><h2 class="aea-h2" id="mine-h">Your subjects</h2><button type="button" class="aea-linkbtn" data-open-subjects>Choose subjects</button></div>
    <div class="aea-groups" data-h="mine"></div>
  </section>
  <section class="suggest" id="suggest" data-suggest data-side="en"></section>
  <noscript><p>This page needs JavaScript switched on.</p></noscript>
</main>
