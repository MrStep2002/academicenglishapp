<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{document.documentElement.setAttribute('data-ui',localStorage.getItem('aea:ui-lang')==='en'?'en':'zh')}catch(e){document.documentElement.setAttribute('data-ui','zh')}</script>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#151935">
<title>中文版 · Academic English App</title>
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/site.css?v=2026-11-08x">
</head>
<body class="aea-page">
<!-- The Chinese version's home page (redesign stage 4, 8 Nov 2026): the same page as the English home (en/index.html), in
     Chinese. en/engine/home.js draws it from the Chinese version's subject list (ZH_SUBJECTS in en/engine/subjects.js: add
     new topics there, not here) and the student's progress; en/engine/shell.js (data-side="zh") adds the sidebar and the top
     bar in Chinese. Every label has both languages (class t-en / t-zh): the English / 中文 switch shows one.
     Class games appear in [data-class-games] (classgame.js), suggestions in [data-suggest]. -->
<main class="aea-wrap" data-home data-side="zh">
  <section class="aea-hello" data-h="hello" aria-label="欢迎"><h1 class="aea-h1"><span class="t-en">Welcome</span><span class="t-zh" lang="zh-CN">欢迎</span></h1></section>
  <div class="aea-classes" data-class-games></div>
  <section class="aea-row" data-h="today" aria-label="今天"></section>
  <section class="aea-sec-wrap" id="subjects" aria-labelledby="mine-h">
    <h2 class="aea-h2" id="mine-h"><span class="t-en">Your subjects</span><span class="t-zh" lang="zh-CN">你的科目</span></h2>
    <div class="aea-grid" data-h="mine"></div>
  </section>
  <section class="aea-sec-wrap" id="more" aria-labelledby="more-h">
    <h2 class="aea-h2 sm" id="more-h"><span class="t-en">More subjects</span><span class="t-zh" lang="zh-CN">更多科目</span></h2>
    <ul class="aea-rows" data-h="more"></ul>
  </section>
  <section class="suggest" id="suggest" data-suggest data-side="zh"></section>
  <noscript><p>This page needs JavaScript switched on. 请打开 JavaScript。</p></noscript>
</main>
<script src="../en/engine/points.js?v=2026-10-29b"></script>
<script src="../en/engine/circuit.js?v=2026-11-08a"></script>
<script src="../en/engine/account.js?v=2026-11-08v"></script>
<script src="../en/engine/subjects.js?v=2026-11-08v"></script>
<script src="../en/engine/shell.js?v=2026-11-08v" data-side="zh"></script>
<script src="../en/engine/classgame.js?v=2026-11-08s"></script>
<script src="../en/engine/suggest.js?v=2026-11-03a"></script>
<script src="../en/engine/home.js?v=2026-11-08v"></script>
</body>
</html>
